name: Validate SEO content
on:
  pull_request:
    paths: ["content/**", "seo/**", "scripts/validate_seo.py"]
  push:
    branches: [main]
    paths: ["content/**", "seo/**", "scripts/validate_seo.py"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_seo.py
