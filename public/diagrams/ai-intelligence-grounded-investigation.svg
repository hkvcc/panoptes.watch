<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Product vision: a plain-language question is answered from the business model and evidence, through visible investigation steps, into observed facts, labelled inferences and suggestions, with a person deciding</title>
<rect x="500" y="14" width="124" height="26" rx="13" class="d-soft"/><rect x="500" y="14" width="124" height="26" rx="13" class="d-accent-s" stroke-width="1"/><text x="562" y="31" class="d-tm d-accent" font-size="10.5" font-weight="600" text-anchor="middle">PRODUCT VISION</text><rect x="120" y="54" width="400" height="46" rx="23" class="d-accent"/><text x="320" y="82" text-anchor="middle" class="d-t" font-size="14" font-weight="600" fill="#fff">“Why did onboarding slow down last week?”</text><path d="M320 100V120" class="d-accent-s" stroke-width="2"/><path d="M316 118L320 122L324 118" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="128" width="290" height="112" rx="14" class="d-surface"/><rect x="20" y="128" width="290" height="112" rx="14" class="d-line" stroke-width="1.2"/><text x="38" y="154" class="d-td d-text" font-size="14" font-weight="600">Business model</text><circle cx="43" cy="176" r="3" class="d-accent-2"/><text x="54" y="180" class="d-t d-muted" font-size="12" font-weight="500">Entities &amp; relationships</text><circle cx="43" cy="196" r="3" class="d-accent-2"/><text x="54" y="200" class="d-t d-muted" font-size="12" font-weight="500">Processes and their stages</text><circle cx="43" cy="216" r="3" class="d-accent-2"/><text x="54" y="220" class="d-t d-muted" font-size="12" font-weight="500">Objectives, owners, expectations</text><rect x="330" y="128" width="290" height="112" rx="14" class="d-surface"/><rect x="330" y="128" width="290" height="112" rx="14" class="d-line" stroke-width="1.2"/><text x="348" y="154" class="d-td d-text" font-size="14" font-weight="600">Evidence</text><circle cx="353" cy="176" r="3" class="d-accent-2"/><text x="364" y="180" class="d-t d-muted" font-size="12" font-weight="500">Metrics vs expected bands</text><circle cx="353" cy="196" r="3" class="d-accent-2"/><text x="364" y="200" class="d-t d-muted" font-size="12" font-weight="500">Business events &amp; volumes</text><circle cx="353" cy="216" r="3" class="d-accent-2"/><text x="364" y="220" class="d-t d-muted" font-size="12" font-weight="500">Change log: releases, rules, staffing</text><path d="M165 240V262H475V240M320 262V280" class="d-accent-s" stroke-width="1.6"/><path d="M316 278L320 282L324 278" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="304" class="d-tm d-muted" font-size="10.5" font-weight="500" letter-spacing=".8">INVESTIGATION STEPS — SHOWN, NOT HIDDEN</text><rect x="20" y="314" width="144" height="40" rx="10" class="d-bg"/><rect x="20" y="314" width="144" height="40" rx="10" class="d-accent-2-s" stroke-width="1.3"/><text x="32" y="339" class="d-tm d-accent" font-size="12" font-weight="700">1</text><text x="48" y="339" class="d-t d-text" font-size="12" font-weight="600">Locate the stage</text><rect x="172" y="314" width="144" height="40" rx="10" class="d-bg"/><rect x="172" y="314" width="144" height="40" rx="10" class="d-accent-2-s" stroke-width="1.3"/><text x="184" y="339" class="d-tm d-accent" font-size="12" font-weight="700">2</text><text x="200" y="339" class="d-t d-text" font-size="12" font-weight="600">Compare segments</text><rect x="324" y="314" width="144" height="40" rx="10" class="d-bg"/><rect x="324" y="314" width="144" height="40" rx="10" class="d-accent-2-s" stroke-width="1.3"/><text x="336" y="339" class="d-tm d-accent" font-size="12" font-weight="700">3</text><text x="352" y="339" class="d-t d-text" font-size="12" font-weight="600">Align with changes</text><rect x="476" y="314" width="144" height="40" rx="10" class="d-bg"/><rect x="476" y="314" width="144" height="40" rx="10" class="d-accent-2-s" stroke-width="1.3"/><text x="488" y="339" class="d-tm d-accent" font-size="12" font-weight="700">4</text><text x="504" y="339" class="d-t d-text" font-size="12" font-weight="600">Test alternatives</text><path d="M320 354V374" class="d-accent-s" stroke-width="2"/><path d="M316 372L320 376L324 372" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="382" width="600" height="120" rx="14" class="d-bg"/><rect x="20" y="382" width="600" height="120" rx="14" class="d-accent-s" stroke-width="1.6"/><circle cx="45" cy="410" r="5" class="d-ok"/><text x="58" y="415" class="d-td d-text" font-size="13" font-weight="700">Observed</text><text x="40" y="442" class="d-t d-text" font-size="12" font-weight="500">Verification wait +1.4 d</text><text x="40" y="460" class="d-t d-muted" font-size="12" font-weight="500">Business tier only [1][2]</text><circle cx="241" cy="410" r="5" class="d-warn"/><text x="254" y="415" class="d-td d-text" font-size="13" font-weight="700">Inferred</text><text x="236" y="442" class="d-t d-text" font-size="12" font-weight="500">Linked to new document</text><text x="236" y="460" class="d-t d-muted" font-size="12" font-weight="500">check · medium confidence</text><path d="M220 398V488" class="d-line"/><circle cx="437" cy="410" r="5" class="d-accent"/><text x="450" y="415" class="d-td d-text" font-size="13" font-weight="700">Suggested</text><text x="432" y="442" class="d-t d-text" font-size="12" font-weight="500">Confirm with Onboarding</text><text x="432" y="460" class="d-t d-muted" font-size="12" font-weight="500">owner; compare cohorts</text><path d="M416 398V488" class="d-line"/><path d="M320 502V522" class="d-accent-s" stroke-width="2"/><path d="M316 520L320 524L324 520" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="530" width="340" height="46" rx="23" class="d-soft"/><text x="320" y="558" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">A person decides: act, dig deeper or dismiss</text>
