<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" fill="none">
<!--STYLE-->
<title>BI and business observability share sources and definitions: a warehouse feeds reports and analysis, while a business model feeds continuous observation and action, with definitions, baselines and interventions flowing between them</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-line-f"/></marker></defs>
