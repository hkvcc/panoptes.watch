<g font-size="13" font-weight="600" class="d-text">
<text x="34" y="78">Metrics, logs, traces</text><text x="34" y="140">SLOs &amp; error budgets</text><text x="34" y="202">Distributed tracing</text><text x="34" y="264">High cardinality</text><text x="34" y="326">Incidents &amp; postmortems</text>
<text x="344" y="78">Business events &amp; state</text><text x="344" y="140">Objectives &amp; commitment budgets</text><text x="344" y="202">Journey tracing</text><text x="344" y="264">Segments</text><text x="344" y="326">Interventions &amp; reviews</text>
</g>
<g font-size="11" class="d-muted">
<text x="34" y="96">machine telemetry</text><text x="34" y="158">availability, latency</text><text x="34" y="220">one request across services</text><text x="34" y="282">per user, per endpoint</text><text x="34" y="344">restore the service</text>
<text x="344" y="96">orders, cases, payments, balances</text><text x="344" y="158">e.g. 95% activated within 48 h</text><text x="344" y="220">one order across systems and teams</text><text x="344" y="282">per cohort, route, region, tier</text><text x="344" y="344">change an outcome, then measure it</text>
</g>
