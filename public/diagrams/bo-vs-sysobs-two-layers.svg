<rect x="36" y="88" width="76" height="22" rx="11" class="d-ok-s" stroke-width="1.5"/><text x="74" y="103" font-size="11" text-anchor="middle" font-weight="600" class="d-ok">SLO met</text>
<path d="M170 106H680" class="d-ok-s" stroke-width="1" stroke-dasharray="4 4"/><text x="680" y="124" font-size="10" text-anchor="end" class="d-tm d-muted">SLO 99.9%</text>
