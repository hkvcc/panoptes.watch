<path d="M170 196L680 194V224L170 226Z" class="d-soft"/>
<path d="M170 212L210 208L250 213L290 209L330 211L370 207L405 210" class="d-accent-s" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
