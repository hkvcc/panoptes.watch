<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Claims process capacity by stage against demand: assessment is the true constraint while the loudest symptoms appear elsewhere</title>
<g class="d-t">
<text x="24" y="28" font-size="15" font-weight="600" class="d-td d-text">The constraint is where work piles up, not where the noise is</text>
<text x="24" y="46" font-size="12" class="d-muted">Home-insurance claims, capacity per stage in claims/day (fictional example)</text>
<rect x="110" y="56" width="340" height="48" rx="10" class="d-surface"/><rect x="110" y="56" width="340" height="48" rx="10" class="d-warn-s" stroke-width="1.5"/>
<text x="124" y="76" font-size="12" font-weight="600" class="d-text">Loudest symptoms</text>
<text x="124" y="93" font-size="11" class="d-muted">Chase calls ×3 at contact centre · approval overtime</text>
<g class="d-line" stroke-width="1"><path d="M100 255H700M100 210H700M100 165H700M100 120H700"/></g>
<path d="M100 300H700" class="d-line" stroke-width="1.5"/>
<g font-size="10.5" class="d-tm d-muted" text-anchor="end"><text x="92" y="304">0</text><text x="92" y="259">50</text><text x="92" y="214">100</text><text x="92" y="169">150</text><text x="92" y="124">200</text></g>
<g stroke-width="1.5">
<rect x="118" y="138" width="64" height="162" rx="4" class="d-surface-2"/><rect x="118" y="138" width="64" height="162" rx="4" class="d-accent-2-s"/>
<rect x="238" y="165" width="64" height="135" rx="4" class="d-surface-2"/><rect x="238" y="165" width="64" height="135" rx="4" class="d-accent-2-s"/>
<rect x="358" y="205.5" width="64" height="94.5" rx="4" class="d-crit" opacity=".18"/><rect x="358" y="205.5" width="64" height="94.5" rx="4" class="d-crit-s" stroke-width="2.5"/>
<rect x="478" y="156" width="64" height="144" rx="4" class="d-surface-2"/><rect x="478" y="156" width="64" height="144" rx="4" class="d-accent-2-s"/>
<rect x="598" y="120" width="64" height="180" rx="4" class="d-surface-2"/><rect x="598" y="120" width="64" height="180" rx="4" class="d-accent-2-s"/>
</g>
<g font-size="11.5" class="d-tm d-text" text-anchor="middle"><text x="150" y="131">180</text><text x="270" y="158">150</text><text x="390" y="198" font-weight="700">105</text><text x="510" y="149">160</text><text x="630" y="113">200</text></g>
<path d="M100 174H700" class="d-warn-s" stroke-width="2" stroke-dasharray="8 5"/>
<path d="M100 210H700" class="d-accent-2-s" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="704" y="171" font-size="10.5" font-weight="600" class="d-text">140</text><text x="704" y="183" font-size="9.5" class="d-muted">storm</text>
<text x="704" y="208" font-size="10.5" font-weight="600" class="d-text">100</text><text x="704" y="220" font-size="9.5" class="d-muted">normal</text>
<g font-size="12.5" font-weight="600" class="d-text" text-anchor="middle"><text x="150" y="320">Intake</text><text x="270" y="320">Triage</text><text x="390" y="320">Assessment</text><text x="510" y="320">Approval</text><text x="630" y="320">Payment</text></g>
<text x="24" y="352" font-size="11" font-weight="600" class="d-tm d-muted">IN QUEUE</text>
<g font-size="12" class="d-tm d-text" text-anchor="middle"><text x="150" y="352">35</text><text x="270" y="352">60</text><text x="390" y="352" font-weight="700" class="d-crit">1,450</text><text x="510" y="352">25</text><text x="630" y="352">15</text></g>
</g>
