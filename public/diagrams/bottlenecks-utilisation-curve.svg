<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Waiting time rises slowly at moderate utilisation, then explodes as utilisation approaches 100 per cent</title>
<g class="d-t">
<text x="24" y="28" font-size="15" font-weight="600" class="d-td d-text">Why waiting explodes near full utilisation</text>
<text x="24" y="46" font-size="12" class="d-muted">Illustrative single-stage queue with random arrivals and variable work</text>
<rect x="600" y="60" width="90" height="260" class="d-crit" opacity=".08"/>
<text x="592" y="98" text-anchor="end" font-size="11" font-weight="600" class="d-muted">high-utilisation zone →</text>
<g class="d-line" stroke-width="1"><path d="M90 60H690M90 125H690M90 190H690M90 255H690"/></g>
<path d="M90 320H690M90 60V320" class="d-line" stroke-width="1.5"/>
<g font-size="10.5" class="d-tm d-muted" text-anchor="end"><text x="82" y="324">0×</text><text x="82" y="259">5×</text><text x="82" y="194">10×</text><text x="82" y="129">15×</text><text x="82" y="64">20×</text></g>
<g font-size="10.5" class="d-tm d-muted" text-anchor="middle"><text x="90" y="340">0%</text><text x="210" y="340">20%</text><text x="330" y="340">40%</text><text x="450" y="340">60%</text><text x="570" y="340">80%</text><text x="690" y="340">100%</text></g>
<text x="390" y="368" text-anchor="middle" font-size="12" class="d-muted">Utilisation of the stage (share of time it is busy)</text>
<text transform="translate(26 190) rotate(-90)" text-anchor="middle" font-size="12" class="d-muted">Waiting time ÷ work time</text>
<path d="M90.0 320.0L210.0 318.4L330.0 315.7L390.0 313.5L450.0 310.3L510.0 304.8L552.0 298.2L582.0 290.4L603.0 281.7L618.0 272.3L630.0 261.5L639.0 250.0L645.0 239.8L651.0 226.5L654.0 218.2L657.0 208.3L660.0 196.5L663.0 182L666.0 164L668.0 150" class="d-accent-2-s" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M90.0 320.0L150.0 318.6L210.0 316.8L270.0 314.4L330.0 311.3L390.0 307.0L420.0 304.1L450.0 300.5L480.0 295.9L510.0 289.7L531.0 283.9L552.0 276.5L570.0 268.0L582.0 260.8L594.0 251.7L603.0 243.3L612.0 233.0L618.0 224.7L624.0 214.8L630.0 203.0L636.0 188.6L642.0 170.5L645.0 159.7L648.0 147.3L651.0 133.0L654.0 116.3L657.0 96.6L660.0 73.0" class="d-accent-s" stroke-width="3"/>
<g><path d="M110 84H140" class="d-accent-s" stroke-width="3"/><text x="148" y="88" font-size="12" class="d-text">More variable arrivals and work</text>
<path d="M110 106H140" class="d-accent-2-s" stroke-width="2.5" stroke-dasharray="7 5"/><text x="148" y="110" font-size="12" class="d-text">Steadier arrivals and work</text></g>
<g font-size="12" font-weight="600" class="d-text">
<circle cx="390" cy="307" r="5" class="d-accent"/><text x="384" y="292" text-anchor="end">50% busy → 1×</text>
<circle cx="570" cy="268" r="5" class="d-accent"/><text x="562" y="258" text-anchor="end">80% → 4×</text>
<circle cx="630" cy="203" r="5" class="d-accent"/><text x="622" y="196" text-anchor="end">90% → 9×</text>
<circle cx="660" cy="73" r="5" class="d-crit"/><text x="668" y="77">95% → 19×</text>
</g>
</g>
</svg>
