<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Explainable composite health score: four weighted indicators, each scored against its expected band, combine into one number whose biggest drag is visible (fictional data)</title>
<text x="20" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">INDICATOR</text><text x="206" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">WEIGHT</text><text x="270" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">SCORE IN BAND TERMS</text><rect x="14" y="36" width="446" height="44" rx="9" class="d-bg"/><rect x="14" y="36" width="446" height="44" rx="9" class="d-warn-s" stroke-width="1.2"/><text x="28" y="63" font-size="12.5" font-weight="600" class="d-t d-text">Payment completion</text><text x="214" y="63" font-size="12" font-weight="400" class="d-tm d-muted">40%</text><rect x="270" y="53" width="110" height="10" rx="5" class="d-surface-2"/><rect x="270" y="53" width="63.8" height="10" rx="5" class="d-warn"/><text x="390" y="63" font-size="10.5" font-weight="400" class="d-t d-muted">outside band</text><rect x="14" y="90" width="446" height="44" rx="9" class="d-surface"/><rect x="14" y="90" width="446" height="44" rx="9" class="d-line" stroke-width="1.2"/><text x="28" y="117" font-size="12.5" font-weight="600" class="d-t d-text">On-time dispatch</text><text x="214" y="117" font-size="12" font-weight="400" class="d-tm d-muted">25%</text><rect x="270" y="107" width="110" height="10" rx="5" class="d-surface-2"/><rect x="270" y="107" width="101.2" height="10" rx="5" class="d-ok"/><text x="390" y="117" font-size="10.5" font-weight="400" class="d-t d-muted">in band</text><rect x="14" y="144" width="446" height="44" rx="9" class="d-surface"/><rect x="14" y="144" width="446" height="44" rx="9" class="d-line" stroke-width="1.2"/><text x="28" y="171" font-size="12.5" font-weight="600" class="d-t d-text">Exceptions resolved</text><text x="214" y="171" font-size="12" font-weight="400" class="d-tm d-muted">20%</text><rect x="270" y="161" width="110" height="10" rx="5" class="d-surface-2"/><rect x="270" y="161" width="96.8" height="10" rx="5" class="d-ok"/><text x="390" y="171" font-size="10.5" font-weight="400" class="d-t d-muted">in band</text><rect x="14" y="198" width="446" height="44" rx="9" class="d-surface"/><rect x="14" y="198" width="446" height="44" rx="9" class="d-line" stroke-width="1.2"/><text x="28" y="225" font-size="12.5" font-weight="600" class="d-t d-text">Contact rate per order</text><text x="214" y="225" font-size="12" font-weight="400" class="d-tm d-muted">15%</text><rect x="270" y="215" width="110" height="10" rx="5" class="d-surface-2"/><rect x="270" y="215" width="88" height="10" rx="5" class="d-ok"/><text x="390" y="225" font-size="10.5" font-weight="400" class="d-t d-muted">in band</text><path d="M466 140H488" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M487 135L492 140L487 145" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="570" cy="140" r="46" class="d-line" stroke-width="10"/><circle cx="570" cy="140" r="46" class="d-accent-s" stroke-width="10" stroke-linecap="round" stroke-dasharray="219.7 289.0" transform="rotate(-90 570 140)"/><text x="570" y="148" font-size="26" font-weight="600" class="d-td d-text" text-anchor="middle">76</text><text x="570" y="210" font-size="10" font-weight="500" class="d-tm d-muted" text-anchor="middle" letter-spacing="1">COMPOSITE</text><rect x="14" y="262" width="632" height="54" rx="10" class="d-soft"/><text x="30" y="284" font-size="12" font-weight="600" class="d-t d-text">Why not higher? 40% of the weight sits on payment completion, which is outside its band.</text><text x="30" y="303" font-size="11.5" font-weight="400" class="d-t d-muted">Every point in the composite traces back to a named indicator, its weight and its band.</text>
</svg>
