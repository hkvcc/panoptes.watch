<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Business health model: one objective (orders are paid for and delivered as promised) broken into three indicators with expected bands, each fed by two observable signals</title>
<text x="20" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">OBJECTIVE</text><text x="250" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">INDICATORS</text><text x="492" y="22" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">SIGNALS</text><rect x="20" y="162" width="190" height="84" rx="13" class="d-soft"/><rect x="20" y="162" width="190" height="84" rx="13" class="d-accent-s" stroke-width="1.6"/><circle cx="40" cy="186" r="5" class="d-accent"/><text x="36" y="214" font-size="13.5" font-weight="600" class="d-t d-text">Orders are paid for and</text><text x="36" y="232" font-size="13.5" font-weight="600" class="d-t d-text">delivered as promised</text><path d="M210 204C230 204 230 72 250 72" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="38" width="200" height="68" rx="11" class="d-surface"/><rect x="250" y="38" width="200" height="68" rx="11" class="d-warn-s" stroke-width="1.6"/><circle cx="268" cy="62" r="5" class="d-warn"/><text x="282" y="66.5" font-size="13.5" font-weight="600" class="d-t d-text">Payment completion</text><text x="268" y="88" font-size="11.5" font-weight="400" class="d-tm d-muted">band 94–97%</text><path d="M450 72C470 72 470 53 492 53" class="d-line" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="34" width="216" height="38" rx="9" class="d-bg"/><rect x="492" y="34" width="216" height="38" rx="9" class="d-line" stroke-width="1.2"/><text x="506" y="57.5" font-size="12" font-weight="400" class="d-t d-text">Authorisation results by route</text><path d="M450 72C470 72 470 99 492 99" class="d-line" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="80" width="216" height="38" rx="9" class="d-bg"/><rect x="492" y="80" width="216" height="38" rx="9" class="d-line" stroke-width="1.2"/><text x="506" y="103.5" font-size="12" font-weight="400" class="d-t d-text">3-D Secure abandonment</text><path d="M210 204C230 204 230 200 250 200" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="166" width="200" height="68" rx="11" class="d-surface"/><rect x="250" y="166" width="200" height="68" rx="11" class="d-line" stroke-width="1.2"/><circle cx="268" cy="190" r="5" class="d-ok"/><text x="282" y="194.5" font-size="13.5" font-weight="600" class="d-t d-text">On-time dispatch</text><text x="268" y="216" font-size="11.5" font-weight="400" class="d-tm d-muted">before carrier cut-off</text><path d="M450 200C470 200 470 181 492 181" class="d-line" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="162" width="216" height="38" rx="9" class="d-bg"/><rect x="492" y="162" width="216" height="38" rx="9" class="d-line" stroke-width="1.2"/><text x="506" y="185.5" font-size="12" font-weight="400" class="d-t d-text">Pick queue vs capacity</text><path d="M450 200C470 200 470 227 492 227" class="d-line" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="208" width="216" height="38" rx="9" class="d-bg"/><rect x="492" y="208" width="216" height="38" rx="9" class="d-line" stroke-width="1.2"/><text x="506" y="231.5" font-size="12" font-weight="400" class="d-t d-text">Carrier collection times</text><path d="M210 204C230 204 230 328 250 328" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="294" width="200" height="68" rx="11" class="d-surface"/><rect x="250" y="294" width="200" height="68" rx="11" class="d-line" stroke-width="1.2"/><circle cx="268" cy="318" r="5" class="d-ok"/><text x="282" y="322.5" font-size="13.5" font-weight="600" class="d-t d-text">Exceptions resolved</text><text x="268" y="344" font-size="11.5" font-weight="400" class="d-tm d-muted">within 1 business day</text><path d="M450 328C470 328 470 309 492 309" class="d-line" stroke-width="1.3" stroke-linecap=