<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Software gained a default observability layer between running systems and operating practice; the business equivalent is mostly missing</title>
<g class="d-t"><text x="8" y="24" font-size="18" font-weight="600" class="d-td d-text">Software</text><text x="8" y="45" font-size="13" class="d-muted">Observability became a default layer</text></g>
<rect x="8" y="62" width="372" height="66" rx="12" class="d-surface"/><rect x="8" y="62" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="26" y="90" font-size="15" font-weight="600" class="d-td d-text">Operating practice</text><text x="26" y="111" font-size="13" class="d-muted">On-call, service levels, incident reviews</text></g><circle cx="354" cy="95" r="10" class="d-ok" fill-opacity=".16"/><path d="M349.5 95l3 3 6-6.5" class="d-ok-s" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="8" y="140" width="372" height="66" rx="12" class="d-surface"/><rect x="8" y="140" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="26" y="168" font-size="15" font-weight="600" class="d-td d-text">Observability</text><text x="26" y="189" font-size="13" class="d-muted">Expected vs actual, across dependencies</text></g><circle cx="354" cy="173" r="10" class="d-ok" fill-opacity=".16"/><path d="M349.5 173l3 3 6-6.5" class="d-ok-s" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="8" y="218" width="372" height="66" rx="12" class="d-surface"/><rect x="8" y="218" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="26" y="246" font-size="15" font-weight="600" class="d-td d-text">Telemetry</text><text x="26" y="267" font-size="13" class="d-muted">Logs, metrics and traces by default</text></g><circle cx="354" cy="251" r="10" class="d-ok" fill-opacity=".16"/><path d="M349.5 251l3 3 6-6.5" class="d-ok-s" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="8" y="296" width="372" height="66" rx="12" class="d-surface-2"/><rect x="8" y="296" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="26" y="324" font-size="15" font-weight="600" class="d-td d-text">Running systems</text><text x="26" y="345" font-size="13" class="d-muted">Services, databases, queues</text></g>
<g class="d-t"><text x="400" y="24" font-size="18" font-weight="600" class="d-td d-text">Business</text><text x="400" y="45" font-size="13" class="d-muted">The equivalent layer is mostly missing</text></g>
<rect x="400" y="62" width="372" height="66" rx="12" class="d-surface"/><rect x="400" y="62" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="418" y="90" font-size="15" font-weight="600" class="d-td d-text">Operating practice</text><text x="418" y="111" font-size="13" class="d-muted">Monthly reviews, escalations by email</text></g><circle cx="746" cy="95" r="10" class="d-warn" fill-opacity=".18"/><path d="M741.5 95h9" class="d-warn-s" stroke-width="2" stroke-linecap="round"/>
<rect x="400" y="140" width="372" height="66" rx="12" class="d-bg"/><rect x="400" y="140" width="372" height="66" rx="12" class="d-accent-s" stroke-width="1.6" stroke-dasharray="6 5"/><g class="d-t"><text x="418" y="168" font-size="15" font-weight="600" class="d-td d-text">Observability</text><text x="418" y="189" font-size="13" class="d-muted">The gap: no continuous, connected view</text></g><circle cx="746" cy="173" r="10" class="d-accent" fill-opacity=".14"/><text x="746" y="177.5" text-anchor="middle" font-size="13" font-weight="700" class="d-t d-text">?</text>
<rect x="400" y="218" width="372" height="66" rx="12" class="d-surface-2"/><rect x="400" y="218" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="418" y="246" font-size="15" font-weight="600" class="d-td d-text">Records and reports</text><text x="418" y="267" font-size="13" class="d-muted">CRM, ERP, billing, support: separate views</text></g>
<rect x="400" y="296" width="372" height="66" rx="12" class="d-surface-2"/><rect x="400" y="296" width="372" height="66" rx="12" class="d-line"/><g class="d-t"><text x="418" y="324" font-size="15" font-weight="600" class="d-td d-text">Running business</text><text x="418" y="345" font-size="13" class="d-muted">Orders, payments, cases, commitments</text></g>
</svg>
