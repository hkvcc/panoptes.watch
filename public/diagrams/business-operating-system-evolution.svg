<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Evolution toward a Business Operating System: Disconnected Systems, Connected Business Model, Continuous Observability, Decision Intelligence, Coordinated Actions</title>
<path d="M40 250C300 250 420 220 560 170S860 70 1000 40" class="d-line" stroke-width="2"/><path d="M40 250C300 250 420 220 560 170S860 70 1000 40" class="d-accent-s d-flow" stroke-width="2"/><g class="d-t"><circle cx="90" cy="247" r="16" class="d-bg"/><circle cx="90" cy="247" r="16" class="d-accent-s" stroke-width="2"/><text x="90" y="251" text-anchor="middle" font-size="11" font-weight="700" class="d-text" >1</text><rect x="4" y="143" width="190" height="66" rx="12" class="d-surface"/><rect x="4" y="143" width="190" height="66" rx="12" class="d-line"/><text x="18" y="169" font-size="13" font-weight="600" class="d-td d-text">Disconnected Systems</text><text x="18" y="189" font-size="11" class="d-muted">Each tool sees its own slice</text></g><g class="d-t"><circle cx="300" cy="232" r="16" class="d-bg"/><circle cx="300" cy="232" r="16" class="d-accent-s" stroke-width="2"/><text x="300" y="236" text-anchor="middle" font-size="11" font-weight="700" class="d-text" >2</text><rect x="205" y="128" width="190" height="66" rx="12" class="d-surface"/><rect x="205" y="128" width="190" height="66" rx="12" class="d-line"/><text x="219" y="154" font-size="13" font-weight="600" class="d-td d-text">Connected Business Model</text><text x="219" y="174" font-size="11" class="d-muted">Entities and dependencies joined</text></g><g class="d-t"><circle cx="520" cy="182" r="16" class="d-bg"/><circle cx="520" cy="182" r="16" class="d-accent-s" stroke-width="2"/><text x="520" y="186" text-anchor="middle" font-size="11" font-weight="700" class="d-text" >3</text><rect x="425" y="78" width="190" height="66" rx="12" class="d-surface"/><rect x="425" y="78" width="190" height="66" rx="12" class="d-line"/><text x="439" y="104" font-size="13" font-weight="600" class="d-td d-text">Continuous Observability</text><text x="439" y="124" font-size="11" class="d-muted">Expected vs actual, always on</text></g><g class="d-t"><circle cx="740" cy="112" r="16" class="d-bg"/><circle cx="740" cy="112" r="16" class="d-accent-s" stroke-width="2"/><text x="740" y="116" text-anchor="middle" font-size="11" font-weight="700" class="d-text" >4</text><rect x="645" y="142" width="190" height="66" rx="12" class="d-surface"/><rect x="645" y="142" width="190" height="66" rx="12" class="d-accent-s"/><text x="659" y="168" font-size="13" font-weight="600" class="d-td d-text">Decision Intelligence</text><text x="659" y="188" font-size="11" class="d-muted">Why it changed, what it affects</text></g><g class="d-t"><circle cx="960" cy="50" r="16" class="d-accent"/><circle cx="960" cy="50" r="16" class="d-accent-s" stroke-width="2"/><text x="960" y="54" text-anchor="middle" font-size="11" font-weight="700" class="" fill="#fff">5</text><rect x="846" y="80" width="190" height="66" rx="12" class="d-surface"/><rect x="846" y="80" width="190" height="66" rx="12" class="d-accent-s"/><text x="860" y="106" font-size="13" font-weight="600" class="d-td d-text">Coordinated Actions</text><text x="860" y="126" font-size="11" class="d-muted">Owned, tracked, measured</text></g></svg>
