<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" fill="none">
<!--STYLE-->
<title>Mix shift: blended conversion rises from 5.0% to 6.8% even though conversion fell in both the web and app segments, because traffic moved towards the higher-converting app</title>
<g class="d-t">
<rect x="20" y="24" width="220" height="266" rx="12" class="d-surface"/><rect x="20" y="24" width="220" height="266" rx="12" class="d-line"/>
<text x="36" y="52" font-size="10" class="d-tm d-muted">WHAT THE DASHBOARD SHOWS</text>
<text x="36" y="112" font-size="13" class="d-text">Blended conversion</text>
<text x="36" y="152" font-size="28" font-weight="600" class="d-td d-text">5.0% → 6.8%</text>
<text x="36" y="182" font-size="13" font-weight="600" class="d-ok">▲ 1.8 pts</text>
<text x="36" y="262" font-size="11" class="d-muted">Looks like a clear win.</text>

<rect x="256" y="24" width="448" height="266" rx="12" class="d-bg"/><rect x="256" y="24" width="448" height="266" rx="12" class="d-line"/>
<text x="272" y="52" font-size="10" class="d-tm d-muted">WHAT IS UNDERNEATH</text>
<text x="272" y="76" font-size="12" font-weight="600" class="d-text">Conversion by segment</text>
<text x="520" y="76" font-size="12" font-weight="600" class="d-text">Traffic mix</text>
<g font-size="10" class="d-muted"><rect x="272" y="86" width="10" height="10" rx="2" class="d-line-f"/><text x="287" y="95">Month A</text><rect x="342" y="86" width="10" height="10" rx="2" class="d-warn"/><text x="357" y="95">Month B</text></g>
<path d="M272 250H490M512 250H690" class="d-line" stroke-width="1.5"/>
<rect x="296" y="194" width="30" height="56" rx="3" class="d-line-f"/><rect x="330" y="201" width="30" height="49" rx="3" class="d-warn"/>
<rect x="400" y="110" width="30" height="140" rx="3" class="d-line-f"/><rect x="434" y="124" width="30" height="126" rx="3" class="d-warn"/>
<g font-size="10" class="d-tm d-text" text-anchor="middle"><text x="311" y="188">4.0</text><text x="345" y="195">3.5</text><text x="415" y="104">10.0</text><text x="449" y="118">9.0</text></g>
