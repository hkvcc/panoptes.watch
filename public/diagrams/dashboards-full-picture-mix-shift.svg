<rect x="530" y="134" width="56" height="116" class="d-soft"/><rect x="530" y="110" width="56" height="24" class="d-accent-2"/>
<rect x="616" y="194" width="56" height="56" class="d-soft"/><rect x="616" y="110" width="56" height="84" class="d-accent-2"/>
<g font-size="10" text-anchor="middle"><text x="558" y="196" class="d-text">Web 83%</text><text x="558" y="126" fill="#fff" font-weight="600">App 17%</text><text x="644" y="226" class="d-text">Web 40%</text><text x="644" y="156" fill="#fff" font-weight="600">App 60%</text></g>
