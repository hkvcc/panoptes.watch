<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none">
<!--STYLE-->
<title>A watermelon metric: monthly SLA attainment reads 96.2% and green, but the same month broken down by day shows Mondays repeatedly below target</title>
<g class="d-t">
<rect x="20" y="20" width="230" height="260" rx="12" class="d-surface"/><rect x="20" y="20" width="230" height="260" rx="12" class="d-line"/>
<text x="36" y="48" font-size="10" class="d-tm d-muted">MONTHLY SLA ATTAINMENT</text>
<text x="36" y="100" font-size="36" font-weight="600" class="d-td d-ok">96.2%</text>
<text x="36" y="126" font-size="12" class="d-text">Target 95% · reported green</text>
<path d="M85 196A50 50 0 0 0 185 196Z" class="d-crit"/>
<path d="M82 196A53 53 0 0 0 188 196" class="d-ok-s" stroke-width="7" stroke-linecap="round"/>
<g class="d-text"><ellipse cx="115" cy="210" rx="2.5" ry="4"/><ellipse cx="135" cy="222" rx="2.5" ry="4"/><ellipse cx="155" cy="210" rx="2.5" ry="4"/><ellipse cx="135" cy="203" rx="2.5" ry="4"/></g>
<text x="36" y="268" font-size="11" class="d-muted">Green outside, red inside.</text>
<text x="280" y="36" font-size="12" font-weight="600" class="d-text">Same month, by day: cases resolved within SLA, %</text>
<g font-size="10" class="d-tm d-muted" text-anchor="middle"><text x="343" y="62">MON</text><text x="395" y="62">TUE</text><text x="447" y="62">WED</text><text x="499" y="62">THU</text><text x="551" y="62">FRI</text><text x="603" y="62">SAT</text><text x="655" y="62">SUN</text></g>
<g font-size="10" class="d-tm d-muted"><text x="276" y="94">WK 1</text><text x="276" y="142">WK 2</text><text x="276" y="190">WK 3</text><text x="276" y="238">WK 4</text></g>
<g fill-opacity=".3">
<g class="d-crit"><rect x="320" y="70" width="46" height="40" rx="6"/><rect x="320" y="118" width="46" height="40" rx="6"/><rect x="320" y="166" width="46" height="40" rx="6"/></g>
<g class="d-warn"><rect x="320" y="214" width="46" height="40" rx="6"/><rect x="372" y="70" width="46" height="40" rx="6"/><rect x="372" y="118" width="46" height="40" rx="6"/><rect x="372" y="166" width="46" height="40" rx="6"/><rect x="372" y="214" width="46" height="40" rx="6"/></g>
<g class="d-ok">
<rect x="424" y="70" width="46" height="40" rx="6"/><rect x="476" y="70" width="46" height="40" rx="6"/><rect x="528" y="70" width="46" height="40" rx="6"/><rect x="580" y="70" width="46" height="40" rx="6"/><rect x="632" y="70" width="46" height="40" rx="6"/>
<rect x="424" y="118" width="46" height="40" rx="6"/><rect x="476" y="118" width="46" height="40" rx="6"/><rect x="528" y="118" width="46" height="40" rx="6"/><rect x="580" y="118" width="46" height="40" rx="6"/><rect x="632" y="118" width="46" height="40" rx="6"/>
<rect x="424" y="166" width="46" height="40" rx="6"/><rect x="476" y="166" width="46" height="40" rx="6"/><rect x="528" y="166" width="46" height="40" rx="6"/><rect x="580" y="166" width="46" height="40" rx="6"/><rect x="632" y="166" width="46" height="40" rx="6"/>
<rect x="424" y="214" width="46" height="40" rx="6"/><rect x="476" y="214" width="46" height="40" rx="6"/><rect x="528" y="214" width="46" height="40" rx="6"/><rect x="580" y="214" width="46" height="40" rx="6"/><rect x="632" y="214" width="46" height="40" rx="6"/>
</g></g>
<g font-size="11" class="d-tm d-text" text-anchor="middle">
<text x="343" y="94" font-weight="700">87</text><text x="395" y="94">93</text><text x="447" y="94">98</text><text x="499" y="94">99</text><text x="551" y="94">98</text><text x="603" y="94">99</text><text x="655" y="94">98</text>
<text x="343" y="142" font-weight="700">89</text><text x="395" y="142">92</text><text x="447" y="142">99</text><text x="499" y="142">98</text><text x="551" y="142">98</text><text x="603" y="142">99</text><text x="655" y="142">99</text>
<text x="343" y="190" font-weight="700">86</text><text x="395" y="190">94</text><text x="447" y="190">98</text><text x="499" y="190">98</text><text x="551" y="190">99</text><text x="603" y="190">98</text><text x="655" y="190">99</text>
<text x="343" y="238" font-weight="700">90</text><text x="395" y="238">93</text><text x="447" y="238">98</text><text x="499" y="238">99</text><text x="551" y="238">98</text><text x="603" y="238">99</text><text x="655" y="238">98</text>
</g>
<text x="280" y="282" font-size="12" class="d-text">Mondays: roughly 1 case in 8 breaches — invisible in the monthly figure.</text>
