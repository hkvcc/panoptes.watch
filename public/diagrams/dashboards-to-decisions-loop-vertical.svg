<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 52 360 408" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>The decision loop: signal, triage, diagnose, decide, act and measure, each step owned and time-bound</title>
<g class="d-t">
<circle cx="180" cy="215" r="128" class="d-line" stroke-width="2"/>
<circle cx="180" cy="215" r="128" class="d-accent-s d-flow" stroke-width="2"/>
<text x="180" y="213" font-size="15" font-weight="600" text-anchor="middle" class="d-td d-text">Decision loop</text>
<text x="180" y="231" font-size="10" text-anchor="middle" class="d-muted">owned · time-bound · measured</text>
<rect x="124.0" y="65.0" width="112" height="44" rx="10" class="d-accent"/><text x="180.0" y="86.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td" fill="#fff">1 · Signal</text><text x="180.0" y="100.0" font-size="10" text-anchor="middle" fill="#fff" opacity=".9">drift vs expected</text>
<rect x="234.9" y="129.0" width="112" height="44" rx="10" class="d-bg"/><rect x="234.9" y="129.0" width="112" height="44" rx="10" class="d-accent-s" stroke-width="1.5"/><text x="290.9" y="150.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td d-text">2 · Triage</text><text x="290.9" y="164.0" font-size="10" text-anchor="middle" class="d-muted">is it real? whose?</text>
<rect x="234.9" y="257.0" width="112" height="44" rx="10" class="d-bg"/><rect x="234.9" y="257.0" width="112" height="44" rx="10" class="d-accent-s" stroke-width="1.5"/><text x="290.9" y="278.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td d-text">3 · Diagnose</text><text x="290.9" y="292.0" font-size="10" text-anchor="middle" class="d-muted">what changed, where</text>
<rect x="124.0" y="321.0" width="112" height="44" rx="10" class="d-bg"/><rect x="124.0" y="321.0" width="112" height="44" rx="10" class="d-accent-s" stroke-width="1.5"/><text x="180.0" y="342.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td d-text">4 · Decide</text><text x="180.0" y="356.0" font-size="10" text-anchor="middle" class="d-muted">option, owner, date</text>
<rect x="13.1" y="257.0" width="112" height="44" rx="10" class="d-bg"/><rect x="13.1" y="257.0" width="112" height="44" rx="10" class="d-accent-s" stroke-width="1.5"/><text x="69.1" y="278.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td d-text">5 · Act</text><text x="69.1" y="292.0" font-size="10" text-anchor="middle" class="d-muted">change ships</text>
<rect x="13.1" y="129.0" width="112" height="44" rx="10" class="d-bg"/><rect x="13.1" y="129.0" width="112" height="44" rx="10" class="d-accent-s" stroke-width="1.5"/><text x="69.1" y="150.0" font-size="13" font-weight="600" text-anchor="middle" class="d-td d-text">6 · Measure</text><text x="69.1" y="164.0" font-size="10" text-anchor="middle" class="d-muted">vs expected path</text>
<rect x="10" y="384" width="340" height="66" rx="12" class="d-surface"/><rect x="10" y="384" width="340" height="66" rx="12" class="d-line"/>
<text x="24" y="408" font-size="11" font-weight="600" class="d-text">The dashboard path, by contrast:</text>
<text x="24" y="428" font-size="11" class="d-muted">metric moves → seen in review → discussed →</text>
<text x="24" y="443" font-size="11" class="d-muted">no owner, no date → resurfaces next quarter</text>
</g>
</svg>