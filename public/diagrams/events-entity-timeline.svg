<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Business events for one renewal plotted on entity timelines: customer, subscription, invoice and payment, with the anatomy of a payment failed event</title>
<g class="d-t">
<text x="24" y="26" font-size="15" font-weight="600" class="d-td d-text">One renewal, told as events on entities</text>
<text x="24" y="44" font-size="12" class="d-muted">Every event names the entities it touches, so the story can be read across lanes (fictional example)</text>
<g font-size="12.5" font-weight="600" class="d-text"><text x="24" y="94">Customer</text><text x="24" y="154">Subscription</text><text x="24" y="214">Invoice</text><text x="24" y="274">Payment</text></g>
<g class="d-line" stroke-width="1.5"><path d="M160 90H740M160 150H740M160 210H740M160 270H740"/></g>
<path d="M448 70V290" class="d-accent-2-s" stroke-width="1" stroke-dasharray="3 4"/>
<g font-size="11" class="d-text" text-anchor="middle">
<circle cx="256" cy="90" r="6" class="d-warn"/><text x="256" y="78">billing email bounced</text>
<circle cx="544" cy="90" r="6" class="d-accent"/><text x="544" y="78">support case: can’t update card</text>
<circle cx="208" cy="150" r="6" class="d-accent"/><text x="208" y="138">renewal reminder sent</text>
<circle cx="448" cy="150" r="6" class="d-accent"/><text x="448" y="138">renewal due</text>
<circle cx="688" cy="150" r="7" class="d-crit"/><text x="700" y="138" text-anchor="end">cancelled (involuntary)</text>
<circle cx="448" cy="210" r="6" class="d-accent"/><text x="448" y="198">invoice issued</text>
<circle cx="616" cy="210" r="6" class="d-warn"/><text x="616" y="198">invoice overdue</text>
<circle cx="456" cy="270" r="7" class="d-crit"/><text x="456" y="292">payment failed (card expired)</text>
<circle cx="520" cy="270" r="6" class="d-warn"/><text x="520" y="258">retry failed</text>
<circle cx="592" cy="270" r="6" class="d-warn"/><text x="592" y="258">retry failed</text>
<circle cx="664" cy="270" r="7" class="d-crit"/><text x="664" y="292">retries exhausted</text>
</g>
<path d="M160 312H740" class="d-line"/>
<g font-size="10.5" class="d-tm d-muted" text-anchor="middle"><text x="208" y="328">day −10</text><text x="328" y="328">day −5</text><text x="448" y="328">day 0</text><text x="568" y="328">day +5</text><text x="688" y="328">day +10</text></g>
<rect x="160" y="344" width="500" height="78" rx="10" class="d-surface"/><rect x="160" y="344" width="500" height="78" rx="10" class="d-crit-s" stroke-width="1.2"/>
<g font-size="11" class="d-tm">
<text x="176" y="364" font-weight="700" class="d-text">payment_failed <tspan font-weight="400" class="d-muted">· occurred_at day 0, 09:14</tspan></text>
<text x="176" y="384" class="d-muted">entities: <tspan class="d-text">customer C-1042 · subscription S-0778 · invoice INV-5521</tspan></text>
<text x="176" y="404" class="d-muted">attributes: <tspan class="d-text">amount £4,800 · attempt 1 · reason card_expired</tspan></text>
</g>
</g>
</svg>
