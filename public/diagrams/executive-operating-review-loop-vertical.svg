<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Executive operating review loop: signal, size, trace, decide, measure</title>
<rect x="12" y="10" width="336" height="108" rx="14" class="d-surface"/><rect x="12" y="10" width="336" height="108" rx="14" class="d-line" stroke-width="1.2"/><circle cx="38" cy="36" r="12" class="d-warn"/><text x="38" y="40" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">01</text><text x="58" y="40" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">SIGNAL</text><text x="132" y="40" class="d-td d-text" font-size="14" font-weight="600">Go-live is drifting</text><text x="28" y="68" class="d-t d-muted" font-size="11.5">Median enterprise go-live has moved from 9 to 16</text><text x="28" y="85" class="d-t d-muted" font-size="11.5">days over three weeks.</text><path d="M180 120 L180 130" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,134 176,127.6 184,127.6" class="d-accent"/><rect x="12" y="138" width="336" height="108" rx="14" class="d-surface"/><rect x="12" y="138" width="336" height="108" rx="14" class="d-line" stroke-width="1.2"/><circle cx="38" cy="164" r="12" class="d-crit"/><text x="38" y="168" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">02</text><text x="58" y="168" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">SIZE</text><text x="132" y="168" class="d-td d-text" font-size="14" font-weight="600">Impact is sized</text><text x="28" y="196" class="d-t d-muted" font-size="11.5">The 10-day commitment is projected at 62%. $1.1M</text><text x="28" y="213" class="d-t d-muted" font-size="11.5">of quarter revenue depends on it.</text><path d="M180 248 L180 258" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,262 176,255.6 184,255.6" class="d-accent"/><rect x="12" y="266" width="336" height="108" rx="14" class="d-surface"/><rect x="12" y="266" width="336" height="108" rx="14" class="d-line" stroke-width="1.2"/><circle cx="38" cy="292" r="12" class="d-accent"/><text x="38" y="296" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">03</text><text x="58" y="296" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">TRACE</text><text x="132" y="296" class="d-td d-text" font-size="14" font-weight="600">Owner is clear</text><text x="28" y="324" class="d-t d-muted" font-size="11.5">The wait sits in verification (COO). It coincides</text><text x="28" y="341" class="d-t d-muted" font-size="11.5">with a rule change — correlation, not yet</text><text x="28" y="358" class="d-t d-muted" font-size="11.5">verified.</text><path d="M180 376 L180 386" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,390 176,383.6 184,383.6" class="d-accent"/><rect x="12" y="394" width="336" height="108" rx="14" class="d-surface-2"/><rect x="12" y="394" width="336" height="108" rx="14" class="d-accent-s" stroke-width="1.6"/><circle cx="38" cy="420" r="12" class="d-accent"/><text x="38" y="424" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">04</text><text x="58" y="424" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">DECIDE</text><text x="132" y="424" class="d-td d-text" font-size="14" font-weight="600">Decision is taken</text><text x="28" y="452" class="d-t d-muted" font-size="11.5">Re-assign reviewer capacity for two weeks; hold</text><text x="28" y="469" class="d-t d-muted" font-size="11.5">new enterprise start dates beyond that.</text><path d="M180 504 L180 514" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,518 176,511.6 184,511.6" class="d-accent"/><rect x="12" y="522" width="336" height="108" rx="14" class="d-surface"/><rect x="12" y="522" width="336" height="108" rx="14" class="d-line" stroke-width="1.2"/><circle cx="38" cy="548" r="12" class="d-ok"/><text x="38" y="552" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">05</text><text x="58" y="552" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">MEASURE</text><text x="132" y="552" class="d-td d-text" font-size="14" font-weight="600">Effect is checked</text><text x="28" y="580" class="d-t d-muted" font-size="11.5">Go-live time and queue depth are watched daily and</text><text x="28" y="597" class="d-t d-muted" font-size="11.5">reviewed at the next meeting.</text><text x="180" y="662" class="d-tm d-muted" font-size="10.5" text-anchor="middle">↺ outcome did not move? the loop reopens</text>
</svg>
