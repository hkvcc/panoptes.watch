<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Executive operating review loop: a signal is detected, its impact sized, an owner identified, a decision taken and its effect measured</title>
<rect x="12" y="24" width="190" height="190" rx="14" class="d-surface"/><rect x="12" y="24" width="190" height="190" rx="14" class="d-line" stroke-width="1.2"/><circle cx="38" cy="52" r="12" class="d-warn"/><text x="38" y="56" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">01</text><text x="58" y="56" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">SIGNAL</text><text x="28" y="94" class="d-td d-text" font-size="15" font-weight="600">Go-live is drifting</text><text x="28" y="120" class="d-t d-muted" font-size="11.5">Median enterprise go-live</text><text x="28" y="137" class="d-t d-muted" font-size="11.5">has moved from 9 to 16 days</text><text x="28" y="154" class="d-t d-muted" font-size="11.5">over three weeks.</text><path d="M204 119 L215 119" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="218,119 211.6,115 211.6,123" class="d-accent"/><rect x="218" y="24" width="190" height="190" rx="14" class="d-surface"/><rect x="218" y="24" width="190" height="190" rx="14" class="d-line" stroke-width="1.2"/><circle cx="244" cy="52" r="12" class="d-crit"/><text x="244" y="56" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">02</text><text x="264" y="56" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">SIZE</text><text x="234" y="94" class="d-td d-text" font-size="15" font-weight="600">Impact is sized</text><text x="234" y="120" class="d-t d-muted" font-size="11.5">The 10-day commitment is</text><text x="234" y="137" class="d-t d-muted" font-size="11.5">projected at 62%. $1.1M of</text><text x="234" y="154" class="d-t d-muted" font-size="11.5">quarter revenue depends on</text><text x="234" y="171" class="d-t d-muted" font-size="11.5">it.</text><path d="M410 119 L421 119" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="424,119 417.6,115 417.6,123" class="d-accent"/><rect x="424" y="24" width="190" height="190" rx="14" class="d-surface"/><rect x="424" y="24" width="190" height="190" rx="14" class="d-line" stroke-width="1.2"/><circle cx="450" cy="52" r="12" class="d-accent"/><text x="450" y="56" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">03</text><text x="470" y="56" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">TRACE</text><text x="440" y="94" class="d-td d-text" font-size="15" font-weight="600">Owner is clear</text><text x="440" y="120" class="d-t d-muted" font-size="11.5">The wait sits in</text><text x="440" y="137" class="d-t d-muted" font-size="11.5">verification (COO). It</text><text x="440" y="154" class="d-t d-muted" font-size="11.5">coincides with a rule</text><text x="440" y="171" class="d-t d-muted" font-size="11.5">change — correlation, not</text><text x="440" y="188" class="d-t d-muted" font-size="11.5">yet verified.</text><path d="M616 119 L627 119" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="630,119 623.6,115 623.6,123" class="d-accent"/><rect x="630" y="24" width="190" height="190" rx="14" class="d-surface-2"/><rect x="630" y="24" width="190" height="190" rx="14" class="d-accent-s" stroke-width="1.6"/><circle cx="656" cy="52" r="12" class="d-accent"/><text x="656" y="56" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">04</text><text x="676" y="56" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">DECIDE</text><text x="646" y="94" class="d-td d-text" font-size="15" font-weight="600">Decision is taken</text><text x="646" y="120" class="d-t d-muted" font-size="11.5">Re-assign reviewer capacity</text><text x="646" y="137" class="d-t d-muted" font-size="11.5">for two weeks; hold new</text><text x="646" y="154" class="d-t d-muted" font-size="11.5">enterprise start dates</text><text x="646" y="171" class="d-t d-muted" font-size="11.5">beyond that.</text><path d="M822 119 L833 119" class="d-accent-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="836,119 829.6,115 829.6,123" class="d-accent"/><rect x="836" y="24" width="190" height="190" rx="14" class="d-surface"/><rect x="836" y="24" width="190" height="190" rx="14" class="d-line" stroke-width="1.2"/><circle cx="862" cy="52" r="12" class="d-ok"/><text x="862" y="56" class="d-tm" font-size="10" font-weight="600" text-anchor="middle" fill="#fff">05</text><text x="882" y="56" class="d-tm d-muted" font-size="10" font-weight="600" letter-spacing="1">MEASURE</text><text x="852" y="94" class="d-td d-text" font-size="15" font-weight="600">Effect is checked</text><text x="852" y="120" class="d-t d-muted" font-size="11.5">Go-live time and queue</text><text x="852" y="137" class="d-t d-muted" font-size="11.5">depth are watched daily and</text><text x="852" y="154" class="d-t d-muted" font-size="11.5">reviewed at the next</text><text x="852" y="171" class="d-t d-muted" font-size="11.5">meeting.</text><path d="M926 214 L926 252 Q926 262 916 262 L118 262 Q108 262 108 252 L108 222" class="d-accent-2-s" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><polygon points="108,218 103.5,225.2 112.5,225.2" class="d-accent-2"/><rect x="330" y="252" width="380" height="20" rx="4" class="d-bg"/><text x="520" y="266" class="d-tm d-muted" font-size="10.5" text-anchor="middle">outcome did not move? the loop reopens with new evidence</text>
</svg>
