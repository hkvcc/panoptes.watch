<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Order to cash to ledger with the six points where money typically goes missing</title>
<text x="12" y="18" class="d-tm d-text" font-size="10" font-weight="600" letter-spacing="0.8">ORDER TO CASH TO LEDGER</text><rect x="12" y="32" width="120" height="44" rx="12" class="d-surface"/><rect x="12" y="32" width="120" height="44" rx="12" class="d-line" stroke-width="1.2"/><text x="72" y="59" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Contract</text><path d="M72 78 L72 118" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="72,122 68,115.6 76,115.6" class="d-accent-2"/><path d="M74 100 L150 100" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="154,100 147.6,96 147.6,104" class="d-crit"/><rect x="158" y="78" width="190" height="44" rx="10" class="d-bg"/><rect x="158" y="78" width="190" height="44" rx="10" class="d-line" stroke-width="1.2"/><rect x="158" y="78" width="4" height="44" rx="2" class="d-crit"/><text x="170" y="97" class="d-t d-text" font-size="11.5" font-weight="600">Usage not billed</text><text x="170" y="113" class="d-tm d-muted" font-size="10">meter vs invoice</text><rect x="12" y="124" width="120" height="44" rx="12" class="d-surface"/><rect x="12" y="124" width="120" height="44" rx="12" class="d-line" stroke-width="1.2"/><text x="72" y="151" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Order</text><path d="M72 170 L72 210" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="72,214 68,207.6 76,207.6" class="d-accent-2"/><path d="M74 192 L150 192" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="154,192 147.6,188 147.6,196" class="d-crit"/><rect x="158" y="170" width="190" height="44" rx="10" class="d-bg"/><rect x="158" y="170" width="190" height="44" rx="10" class="d-line" stroke-width="1.2"/><rect x="158" y="170" width="4" height="44" rx="2" class="d-crit"/><text x="170" y="189" class="d-t d-text" font-size="11.5" font-weight="600">Expired discounts</text><text x="170" y="205" class="d-tm d-muted" font-size="10">price vs contract</text><rect x="12" y="216" width="120" height="44" rx="12" class="d-surface"/><rect x="12" y="216" width="120" height="44" rx="12" class="d-line" stroke-width="1.2"/><text x="72" y="243" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Invoice</text><path d="M72 262 L72 302" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="72,306 68,299.6 76,299.6" class="d-accent-2"/><path d="M74 284 L150 284" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="154,284 147.6,280 147.6,288" class="d-crit"/><rect x="158" y="262" width="190" height="44" rx="10" class="d-bg"/><rect x="158" y="262" width="190" height="44" rx="10" class="d-line" stroke-width="1.2"/><rect x="158" y="262" width="4" height="44" rx="2" class="d-crit"/><text x="170" y="281" class="d-t d-text" font-size="11.5" font-weight="600">Failed payments</text><text x="170" y="297" class="d-tm d-muted" font-size="10">tried vs captured</text><rect x="12" y="308" width="120" height="44" rx="12" class="d-surface"/><rect x="12" y="308" width="120" height="44" rx="12" class="d-line" stroke-width="1.2"/><text x="72" y="335" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Payment</text><path d="M72 354 L72 394" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="72,398 68,391.6 76,391.6" class="d-accent-2"/><path d="M74 376 L150 376" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="154,376 147.6,372 147.6,380" class="d-crit"/><rect x="158" y="354" width="190" height="44" rx="10" class="d-bg"/><rect x="158" y="354" width="190" height