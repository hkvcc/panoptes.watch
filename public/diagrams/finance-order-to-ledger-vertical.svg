" width="190" height="44" rx="10" class="d-bg"/><rect x="158" y="538" width="190" height="44" rx="10" class="d-line" stroke-width="1.2"/><rect x="158" y="538" width="4" height="44" rx="2" class="d-crit"/><text x="170" y="557" class="d-t d-text" font-size="11.5" font-weight="600">Unapplied cash</text><text x="170" y="573" class="d-tm d-muted" font-size="10">paid vs matched</text><rect x="12" y="584" width="120" height="44" rx="12" class="d-surface"/><rect x="12" y="584" width="120" height="44" rx="12" class="d-line" stroke-width="1.2"/><text x="72" y="611" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Ledger</text>
