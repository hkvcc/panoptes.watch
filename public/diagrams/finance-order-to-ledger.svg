x="958" y="129" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Ledger</text><path d="M155 132 L155 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="155,210 151,203.6 159,203.6" class="d-crit"/><rect x="87" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="87" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="87" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="101" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Usage not billed</text><text x="101" y="256" class="d-tm d-muted" font-size="10">meter vs invoice</text><path d="M301 132 L301 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="301,210 297,203.6 305,203.6" class="d-crit"/><rect x="233" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="233" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="233" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="247" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Expired discounts</text><text x="247" y="256" class="d-tm d-muted" font-size="10">price vs contract</text><path d="M447 132 L447 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="447,210 443,203.6 451,203.6" class="d-crit"/><rect x="379" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="379" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="379" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="393" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Failed payments</text><text x="393" y="256" class="d-tm d-muted" font-size="10">tried vs captured</text><path d="M593 132 L593 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="593,210 589,203.6 597,203.6" class="d-crit"/><rect x="525" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="525" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="525" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="539" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Refunds, disputes</text><text x="539" y="256" class="d-tm d-muted" font-size="10">captured vs kept</text><path d="M739 132 L739 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="739,210 735,203.6 743,203.6" class="d-crit"/><rect x="671" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="671" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="671" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="685" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Fee variance</text><text x="685" y="256" class="d-tm d-muted" font-size="10">gross vs net</text><path d="M885 132 L885 206" class="d-crit-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><polygon points="885,210 881,203.6 889,203.6" class="d-crit"/><rect x="817" y="214" width="136" height="58" rx="10" class="d-bg"/><rect x="817" y="214" width="136" height="58" rx="10" class="d-line" stroke-width="1.2"/><rect x="817" y="214" width="4" height="58" rx="2" class="d-crit"/><text x="831" y="238" class="d-t d-text" font-size="11.5" font-weight="600">Unapplied cash</text><text x="831" y="256" class="d-tm d-muted" font-size="10">paid vs matched</text><text x="22" y="310" class="d-tm d-muted" font-size="10.5">Each hand-off is a comparison of expected and actual. Leakage is the difference that nobody owns.</text>
</svg>
