<title>Order to cash to ledger: contract, order, invoice, payment, settlement, reconciliation and ledger, with the six points where money typically goes missing</title>
<text x="22" y="24" class="d-tm d-text" font-size="10" font-weight="600" letter-spacing="0.8">ORDER TO CASH TO LEDGER · WHERE MONEY GOES MISSING</text><path d="M82 86 L82 74 L374 74 L374 86" class="d-accent-2-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="144" y="64" width="168" height="20" rx="4" class="d-bg"/><text x="228" y="78" class="d-tm d-accent" font-size="10.5" font-weight="600" text-anchor="middle">contracted vs billed</text><path d="M374 86 L374 74 L666 74 L666 86" class="d-accent-2-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="436" y="64" width="168" height="20" rx="4" class="d-bg"/><text x="520" y="78" class="d-tm d-accent" font-size="10.5" font-weight="600" text-anchor="middle">billed vs collected</text><path d="M666 86 L666 74 L958 74 L958 86" class="d-accent-2-s" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="64" width="168" height="20" rx="4" class="d-bg"/><text x="812" y="78" class="d-tm d-accent" font-size="10.5" font-weight="600" text-anchor="middle">collected vs posted</text><rect x="22" y="100" width="120" height="48" rx="12" class="d-surface"/><rect x="22" y="100" width="120" height="48" rx="12" class="d-line" stroke-width="1.2"/><text x="82" y="129" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Contract</text><path d="M144 124 L164 124" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="167,124 160.6,120 160.6,128" class="d-accent-2"/><rect x="168" y="100" width="120" height="48" rx="12" class="d-surface"/><rect x="168" y="100" width="120" height="48" rx="12" class="d-line" stroke-width="1.2"/><text x="228" y="129" class="d-t d-text" font-size="13" font-weight="600" text-anchor="middle">Order</text><path d="M290 124 L310 124" class="d-accent-2-s" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="313,124 306.6,120 306.6,128" class