t"/><circle cx="342.5" cy="82" r="5.5" class="d-accent-2"/><circle cx="363" cy="82" r="5.5" class="d-accent-2"/><circle cx="383.5" cy="82" r="5.5" class="d-accent-2"/><circle cx="404" cy="82" r="5.5" class="d-accent-2"/><circle cx="158" cy="102" r="5.5" class="d-accent-2"/><circle cx="178.5" cy="102" r="5.5" class="d-accent-2"/><circle cx="199" cy="102" r="5.5" class="d-accent"/><circle cx="219.5" cy="102" r="5.5" class="d-accent-2"/><circle cx="240" cy="102" r="5.5" class="d-accent-2"/><circle cx="260.5" cy="102" r="5.5" class="d-accent-2"/><circle cx="281" cy="102" r="5.5" class="d-accent-2"/><circle cx="301.5" cy="102" r="5.5" class="d-accent-2"/><circle cx="322" cy="102" r="5.5" class="d-accent-2"/><circle cx="342.5" cy="102" r="5.5" class="d-accent"/><circle cx="363" cy="102" r="5.5" class="d-accent-2"/><circle cx="383.5" cy="102" r="5.5" class="d-accent-2"/><circle cx="404" cy="102" r="5.5" class="d-accent-2"/><circle cx="158" cy="122" r="5.5" class="d-accent-2"/><circle cx="178.5" cy="122" r="5.5" class="d-accent-2"/><circle cx="199" cy="122" r="5.5" class="d-accent-2"/><circle cx="219.5" cy="122" r="5.5" class="d-accent"/><circle cx="240" cy="122" r="5.5" class="d-accent-2"/><circle cx="260.5" cy="122" r="5.5" class="d-accent-2"/><circle cx="281" cy="122" r="5.5" class="d-accent-2"/><circle cx="301.5" cy="122" r="5.5" class="d-accent-2"/><path d="M436 92H530" class="d-accent-s d-flow" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M529 87L534 92L529 97" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="24" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">THROUGHPUT</text><text x="550" y="44" font-size="12" font-weight="400" class="d-t d-muted">cases finished</text><text x="550" y="60" font-size="12" font-weight="400" class="d-t d-muted">per day</text><rect x="20" y="172" width="620" height="82" rx="14" class="d-soft"/><rect x="20" y="172" width="620" hei