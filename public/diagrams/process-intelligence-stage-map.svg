0" font-weight="500" class="d-tm d-crit" letter-spacing="1">03</text><text x="370" y="140" font-size="13.5" font-weight="600" class="d-t d-text">Identity</text><text x="370" y="157" font-size="13.5" font-weight="600" class="d-t d-text">verification</text><text x="370" y="176" font-size="10.5" font-weight="400" class="d-tm d-muted">wait 19h · work 24m</text><path d="M517 138L521 142L517 146" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="428" y="108" width="70" height="18" rx="9" class="d-crit"/><text x="463" y="121" font-size="10" font-weight="600" class="d-t" fill="#fff" text-anchor="middle">constraint</text><rect x="524" y="96" width="154" height="92" rx="12" class="d-surface"/><rect x="524" y="96" width="154" height="92" rx="12" class="d-line" stroke-width="1.2"/><text x="538" y="118" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">04</text><text x="538" y="140" font-size="13.5" font-weight="600" class="d-t d-text">Risk review</text><text x="538" y="176" font-size="10.5" font-weight="400" class="d-tm d-muted">wait 6h · work 1h</text><path d="M685 138L689 142L685 146" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="692" y="96" width="154" height="92" rx="12" class="d-surface"/><rect x="692" y="96" width="154" height="92" rx="12" class="d-line" stroke-width="1.2"/><text x="706" y="118" font-size="10" font-weight="500" class="d-tm d-muted" letter-spacing="1">05</text><text x="706" y="140" font-size="13.5" font-weight="600" class="d-t d-text">Approval</text><text x="706" y="176" font-size="10.5" font-weight="400" class="d-tm d-muted">wait 3h · work 12m</text><path d="M853 138L857 142L853 146" class="d-accent-s" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="860" y="96" width="154" height="92" rx="12" class="d-surface"/><rect x="860" y="96" width="154" height="92" rx="12" class="d-line" stroke-width="1.2"/><text x="874" y