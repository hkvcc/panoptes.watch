<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Merchant onboarding by stage: median work time versus waiting time, and share of cases returned for rework</title>
<g class="d-t">
<text x="24" y="30" font-size="15" font-weight="600" class="d-td d-text">Merchant onboarding: where the days go</text>
<text x="24" y="50" font-size="12" class="d-muted">Median days per stage this quarter (fictional example)</text>
<rect x="24" y="66" width="14" height="10" rx="2" class="d-accent"/><text x="44" y="75" font-size="11.5" class="d-text">Work</text>
<rect x="90" y="66" width="14" height="10" rx="2" class="d-surface-2"/><rect x="90" y="66" width="14" height="10" rx="2" class="d-accent-2-s"/><text x="110" y="75" font-size="11.5" class="d-text">Waiting</text>
<text x="696" y="75" text-anchor="end" font-size="11" font-weight="600" class="d-tm d-muted">RETURNED</text>
<!-- grid -->
<g class="d-line" stroke-width="1"><path d="M190 92V296M240 92V296M290 92V296M340 92V296M390 92V296M440 92V296M490 92V296"/></g>
<g font-size="10.5" class="d-tm d-muted" text-anchor="middle"><text x="190" y="312">0</text><text x="240" y="312">1</text><text x="290" y="312">2</text><text x="340" y="312">3</text><text x="390" y="312">4</text><text x="440" y="312">5</text><text x="490" y="312">6 days</text></g>
<!-- rows: y center 112, 152, 192, 232, 272 -->
<text x="24" y="116" font-size="12.5" font-weight="600" class="d-text">Business verification</text>
<rect x="190" y="101" width="20" height="22" rx="3" class="d-accent"/><rect x="210" y="101" width="80" height="22" rx="3" class="d-surface-2"/><rect x="210" y="101" width="80" height="22" rx="3" class="d-accent-2-s"/>
<text x="298" y="116" font-size="11" class="d-tm d-muted">2.0</text><text x="696" y="116" text-anchor="end" font-size="12" class="d-tm d-text">4%</text>

<rect x="16" y="137" width="688" height="30" rx="8" class="d-soft" opacity=".55"/>
<text x="24" y="156" font-size="12.5" font-weight="600" class="d-text">Risk review</text>
<rect x="190" y="141" width="30" height="22" rx="3" class="d-accent"/><rect x="220" y="141" width="195" height="22" rx="3" class="d-surface-2"/><rect x="220" y="141" width="195" height="22" rx="3" class="d-crit-s" stroke-width="1.5"/>
<text x="423" y="156" font-size="11" class="d-tm d-text">4.5</text><text x="452" y="156" font-size="11" class="d-muted">was 1.5 last quarter</text>
<text x="696" y="156" text-anchor="end" font-size="12" font-weight="700" class="d-tm d-crit">22%</text>

<text x="24" y="196" font-size="12.5" font-weight="600" class="d-text">Integration</text>
<text x="24" y="210" font-size="10.5" class="d-muted">(customer-side)</text>
<rect x="190" y="181" width="150" height="22" rx="3" class="d-accent"/><rect x="340" y="181" width="125" height="22" rx="3" class="d-surface-2"/><rect x="340" y="181" width="125" height="22" rx="3" class="d-accent-2-s"/>
<text x="473" y="196" font-size="11" class="d-tm d-muted">5.5</text><text x="696" y="196" text-anchor="end" font-size="12" class="d-tm d-text">6%</text>

<text x="24" y="236" font-size="12.5" font-weight="600" class="d-text">Account configuration</text>
<rect x="190" y="221" width="25" height="22" rx="3" class="d-accent"/><rect x="215" y="221" width="125" height="22" rx="3" class="d-surface-2"/><rect x="215" y="221" width="125" height="22" rx="3" class="d-accent-2-s"/>
<text x="348" y="236" font-size="11" class="d-tm d-muted">3.0</text><text x="696" y="236" text-anchor="end" font-size="12" class="d-tm d-text">3%</text>

<text x="24" y="276" font-size="12.5" font-weight="600" class="d-text">Go-live checks</text>
<rect x="190" y="261" width="10" height="22" rx="3" class="d-accent"/><rect x="200" y="261" width="65" height="22" rx="3" class="d-surface-2"/><rect x="200" y="261" width="65" height="22" rx="3" class="d-accent-2-s"/>
<text x="273" y="276" font-size="11" class="d-tm d-muted">1.5</text><text x="696" y="276" text-anchor="end" font-size="12" class="d-tm d-text">1%</text>

<path d="M24 326H696" class="d-line"/>
<text x="24" y="347" font-size="12" class="d-text"><tspan font-weight="600">Flow efficiency</tspan> <tspan class="d-muted">(work ÷ elapsed, summed across stages):</tspan> <tspan class="d-tm">4.7 ÷ 16.5 ≈ 28%</tspan></text>
</g>
</svg>
