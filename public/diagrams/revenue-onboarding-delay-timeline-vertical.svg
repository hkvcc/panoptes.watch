<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Planned versus actual route to cash for one deal: go-live and first cash 17 days late</title>
<text x="12" y="18" class="d-tm d-text" font-size="10" font-weight="600" letter-spacing="0.8">ONE DEAL · PLANNED VS ACTUAL</text><text x="196" y="44" class="d-tm d-muted" font-size="10" text-anchor="middle">PLANNED</text><text x="296" y="44" class="d-tm d-muted" font-size="10" text-anchor="middle">ACTUAL</text><rect x="12" y="58" width="336" height="50" rx="10" class="d-surface"/><rect x="12" y="58" width="336" height="50" rx="10" class="d-line" stroke-width="1.2"/><circle cx="30" cy="83" r="5" class="d-ok"/><text x="44" y="88" class="d-t d-text" font-size="12.5" font-weight="600">Signed</text><text x="196" y="88" class="d-tm d-muted" font-size="11" text-anchor="middle">day 0</text><text x="296" y="88" class="d-tm d-text" font-size="11" font-weight="600" text-anchor="middle">day 0</text><rect x="12" y="120" width="336" height="50" rx="10" class="d-bg"/><rect x="12" y="120" width="336" height="50" rx="10" class="d-line" stroke-width="1.2"/><circle cx="30" cy="145" r="5" class="d-warn"/><text x="44" y="150" class="d-t d-text" font-size="12.5" font-weight="600">Kick-off</text><text x="196" y="150" class="d-tm d-muted" font-size="11" text-anchor="middle">day 2</text><text x="296" y="150" class="d-tm d-warn" font-size="11" font-weight="600" text-anchor="middle">day 5</text><rect x="12" y="182" width="336" height="50" rx="10" class="d-surface"/><rect x="12" y="182" width="336" height="50" rx="10" class="d-line" stroke-width="1.2"/><circle cx="30" cy="207" r="5" class="d-crit"/><text x="44" y="212" class="d-t d-text" font-size="12.5" font-weight="600">Verified</text><text x="196" y="212" class="d-tm d-muted" font-size="11" text-anchor="middle">day 6</text><text x="296" y="212" class="d-tm d-crit" font-size="11" font-weight="600" text-anchor="middle">day 24</text><rect x="12" y="244" width="336" height="50" rx="10" class="d-bg"/><rect x="12" y="244" width="336" height="50" rx="10" class="d-line" stroke-width="1.2"/><circle cx="30" cy="269" r="5" class="d-crit"/><text x="44" y="274" class="d-t d-text" font-size="12.5" font-weight="600">Live + first invoice</text><text x="196" y="274" class="d-tm d-muted" font-size="11" text-anchor="middle">day 14</text><text x="296" y="274" class="d-tm d-crit" font-size="11" font-weight="600" text-anchor="middle">day 31</text><rect x="12" y="306" width="336" height="50" rx="10" class="d-surface"/><rect x="12" y="306" width="336" height="50" rx="10" class="d-line" stroke-width="1.2"/><circle cx="30" cy="331" r="5" class="d-crit"/><text x="44" y="336" class="d-t d-text" font-size="12.5" font-weight="600">Cash received</text><text x="196" y="336" class="d-tm d-muted" font-size="11" text-anchor="middle">day 44</text><text x="296" y="336" class="d-tm d-crit" font-size="11" font-weight="600" text-anchor="middle">day 61</text><text x="12" y="386" class="d-tm d-muted" font-size="10.5">Verification waited 19 days on documents</text><text x="12" y="402" class="d-tm d-muted" font-size="10.5">and queue time; first cash moved 17 days.</text>
