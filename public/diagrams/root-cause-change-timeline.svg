00">no route link</text><path d="M245 50V280" class="d-accent-s" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="245" cy="56" r="5" class="d-accent"/><text x="254" y="60" class="d-t d-text" font-size="12" font-weight="600">Fraud rule v14</text><text x="254" y="76" class="d-t d-muted" font-size="11" font-weight="500">route B only</text><path d="M375 50V280" class="d-line" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="375" cy="56" r="5" class="d-line-f"/><text x="384" y="60" class="d-t d-muted" font-size="12" font-weight="600">Issuer maintenance</text><text x="384" y="76" class="d-t d-muted" font-size="11" font-weight="500">after onset</text><path d="M526.7 50V280" class="d-ok-s" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="526.7" cy="56" r="5" class="d-ok"/><text x="535.7" y="60" class="d-t d-text" font-size="12" font-weight="600">Full rollback</text><text x="535.7" y="76" class="d-t d-muted" font-size="11" font-weight="500">recovery</text><text x="270.5" y="268" class="d-t d-crit" font-size="11" font-weight="600">onset +40 min</text><text x="437.8" y="200" class="d-t d-ok" font-size="11" font-weight="600">10% holdout</text><text x="437.8" y="214" class="d-t d-muted" font-size="11" font-weight="500">on old rule</text><text x="50" y="302" class="d-tm d-muted" font-size="10.5" font-weight="500">Mon 06:00</text><text x="310" y="302" class="d-tm d-muted" font-size="10.5" font-weight="500" text-anchor="middle">Mon 18:00</text><text x="570" y="302" class="d-tm d-muted" font-size="10.5" font-weight="500" text-anchor="middle">Tue 06:00</text><text x="50" y="342" class="d-t d-text" font-size="11.5" font-weight="500">The holdout recovers while the rest of route B stays low: evidence from intervention, not just timing.</text>
