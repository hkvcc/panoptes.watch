idth="1.2"/><text x="115" y="256.5" class="d-t d-text" font-size="12" font-weight="600" text-anchor="middle">First invoice</text><path d="M115 268 L115 282" class="d-line" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="282" width="150" height="32" rx="16" class="d-bg"/><rect x="40" y="282" width="150" height="32" rx="16" class="d-line" stroke-width="1.2"/><text x="115" y="302.5" class="d-t d-text" font-size="12" font-weight="600" text-anchor="middle">Payment</text><circle cx="182" cy="148" r="5" class="d-crit d-pulse"/><rect x="210" y="98" width="120" height="32" rx="16" class="d-bg"/><rect x="210" y="98" width="120" height="32" rx="16" class="d-accent-2-s" stroke-width="1.2"/><text x="270" y="118.5" class="d-t d-text" font-size="12" font-weight="600" text-anchor="middle">Team capacity</text><path d="M210 114 L190 144" class="d-line" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="190" width="120" height="32" rx="16" class="d-bg"/><rect x="210" y="190" width="120" height="32" rx="16" class="d-accent-2-s" stroke-width="1.2"/><text x="270" y="210.5" class="d-t d-text" font-size="12" font-weight="600" text-anchor="middle">SLA ≤ 48h</text><path d="M210 206 L190 160" class="d-line" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="250" class="d-tm d-crit" font-size="10" font-weight="600" text-anchor="middle">median wait</text><text x="270" y="264" class="d-tm d-crit" font-size="10" font-weight="600" text-anchor="middle">4.1h → 9.6h</text><rect x="10" y="356" width="340" height="74" rx="12" class="d-bg"/><rect x="10" y="356" width="340" height="74" rx="12" class="d-line" stroke-width="1.2"/><text x="26" y="378" class="d-tm d-accent" font-size="10" font-weight="600" letter-spacing="0.6">CEO · EXECUTIVES</text><text x="26" y="400" class="d-td d-text" font-size="14" font-weight="600">Is the business working?</text><text x="26" y="418" class="d-tm d-muted" font-size="10.5">sees › Commitments at risk</text><rect x="10" y="440" width="340" height="74" rx="12" class="d-bg"/><rect x="10" y="440" width="340" height="74" rx="12" class="d-line" stroke-width="1.2"/><text x="26" y="462" class="d-tm d-accent" font-size="10" font-weight="600" letter-spacing="0.6">COO · OPERATIONS</text><text x="26" y="484" class="d-td d-text" font-size="14" font-weight="600">Where is work waiting?</text><text x="26" y="502" class="d-tm d-muted" font-size="10.5">sees › Queue depth vs capacity</text><rect x="10" y="524" width="340" height="74" rx="12" class="d-bg"/><rect x="10" y="524" width="340" height="74" rx="12" class="d-line" stroke-width="1.2"/><text x="26" y="546" class="d-tm d-accent" font-size="10" font-weight="600" letter-spacing="0.6">CFO · FINANCE</text><text x="26" y="568" class="d-td d-text" font-size="14" font-weight="600">Why did the numbers move?</text><text x="26" y="586" class="d-tm d-muted" font-size="10.5">sees › Deferred revenue</text><rect x="10" y="608" width="340" height="74" rx="12" class="d-bg"/><rect x="10" y="608" width="340" height="74" rx="12" class="d-line" stroke-width="1.2"/><text x="26" y="630" class="d-tm d-accent" font-size="10" font-weight="600" letter-spacing="0.6">CRO · REVENUE</text><text x="26" y="652" class="d-td d-text" font-size="14" font-weight="600">Where does revenue stall?</text><text x="26" y="670" class="d-tm d-muted" font-size="10.5">sees › Time to first invoice</text><rect x="10" y="692" width="340" height="74" rx="12" class="d-bg"/><rect x="10" y="692" width="340" height="74" rx="12" class="d-line" stroke-width="1.2"/><text x="26" y="714" class="d-tm d-accent" font-size="10" font-weight="600" letter-spacing="0.6">CX · CUSTOMER EXPERIENCE</text><text x="26" y="736" class="d-td d-text" font-size="14" font-weight="600">Are we keeping promises?</text><text x="26" y="754" class="d-tm d-muted" font-size="10.5">sees › Broken promises</text>
