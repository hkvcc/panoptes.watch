<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Triage flow: a detected change is checked for duration, then for a known explanation, then for impact on an objective, before an investigation is opened with an owner. Other branches keep watching, annotate, or log at low priority.</title>
<text x="20" y="28" font-size="11" letter-spacing=".06em" class="d-tm d-muted">TRIAGE PATH FOR A DETECTED CHANGE</text><rect x="20" y="48" width="320" height="58" rx="12" class="d-surface"/><rect x="20" y="48" width="320" height="58" rx="12" class="d-accent-s"/><text x="36" y="72" font-size="14" font-weight="600" class="d-td d-text">Change detected</text><text x="36" y="92" font-size="11.5" class="d-t d-muted">Refund requests above expected range</text><path d="M80 108V128" class="d-accent-s" stroke-width="2"/><path d="M80 130l-5 -7h10z" class="d-accent"/><rect x="20" y="130" width="320" height="58" rx="12" class="d-surface"/><rect x="20" y="130" width="320" height="58" rx="12" class="d-line"/><text x="36" y="154" font-size="13" font-weight="700" class="d-tm d-accent">?</text><text x="54" y="154" font-size="14" font-weight="600" class="d-td d-text">Outside range long enough?</text><text x="36" y="174" font-size="11.5" class="d-t d-muted">Duration and size vs tolerance</text><path d="M80 190V210" class="d-accent-s" stroke-width="2"/><path d="M80 212l-5 -7h10z" class="d-accent"/><text x="90" y="206" font-size="11" font-weight="600" class="d-tm d-accent">Yes</text><path d="M342 159H374" class="d-line" stroke-width="1.5"/><path d="M378 159l-7 -5v10z" class="d-line-f"/><text x="350" y="153" font-size="11" class="d-tm d-muted">No</text><rect x="380" y="139" width="160" height="40" rx="20" class="d-bg"/><rect x="380" y="139" width="160" height="40" rx="20" class="d-line"/><text x="460" y="164" font-size="12.5" font-weight="600" text-anchor="middle" class="d-t d-muted">Keep watching</text><rect x="20" y="212" width="320" height="58" rx="12" class="d-surface"/><rect x="20" y="212" width="320" height="58" rx="12" class="d-line"/><text x="36" y="236" font-size="13" font-weight="700" class="d-tm d-accent">?</text><text x="54" y="236" font-size="14" font-weight="600" class="d-td d-text">Explained by a known event?</text><text x="36" y="256" font-size="11.5" class="d-t d-muted">Promotions, holidays, releases, pricing</text><path d="M80 272V292" class="d-accent-s" stroke-width="2"/><path d="M80 294l-5 -7h10z" class="d-accent"/><text x="90" y="288" font-size="11" font-weight="600" class="d-tm d-accent">No</text><path d="M342 241H374" class="d-line" stroke-width="1.5"/><path d="M378 241l-7 -5v10z" class="d-line-f"/><text x="350" y="235" font-size="11" class="d-tm d-muted">Yes</text><rect x="380" y="221" width="160" height="40" rx="20" class="d-bg"/><rect x="380" y="221" width="160" height="40" rx="20" class="d-line"/><text x="460" y="246" font-size="12.5" font-weight="600" text-anchor="middle" class="d-t d-muted">Annotate it</text><rect x="20" y="294" width="320" height="58" rx="12" class="d-surface"/><rect x="20" y="294" width="320" height="58" rx="12" class="d-line"/><text x="36" y="318" font-size="13" font-weight="700" class="d-tm d-accent">?</text><text x="54" y="318" font-size="14" font-weight="600" class="d-td d-text">Touches an objective?</text><text x="36" y="338" font-size="11.5" class="d-t d-muted">Linked commitments, revenue, customers</text><path d="M80 354V374" class="d-accent-s" stroke-width="2"/><path d="M80 376l-5 -7h10z" class="d-accent"/><text x="90" y="370" font-size="11" font-weight="600" class="d-tm d-accent">Yes</text><path d="M342 323H374" class="d-line" stroke-width="1.5"/><path d="M378 323l-7 -5v10z" class="d-line-f"/><text x="350" y="317" font-size="11" class="d-tm d-muted">No</text><rect x="380" y="303" width="160" height="40" rx="20" class="d-bg"/><rect x="380" y="303" width="160" height="40" rx="20" class="d-line"/><text x="460" y="328" font-size="12.5" font-weight="600" text-anchor="middle" class="d-t d-muted">Log, low priority</text><rect x="20" y="376" width="320" height="58" rx="12" class="d-surface"/><rect x="20" y="376" width="320" height="58" rx="12" class="d-accent-s"/><rect x="20" y="376" width="320" height="58" rx="12" class="d-accent-s" stroke-width="2"/><text x="36" y="400" font-size="14" font-weight="600" class="d-td d-text">Open investigation</text><text x="36" y="420" font-size="11.5" class="d-t d-muted">Owner assigned, evidence attached</text>
</svg>
