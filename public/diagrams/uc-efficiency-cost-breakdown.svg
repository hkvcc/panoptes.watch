<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Stacked bars of cost to serve per order: total rises from 100 in Q1 to 109 in Q2, almost entirely from rework and exceptions, which doubled, and extra customer contacts. Illustrative data.</title>
<text x="20" y="28" font-size="11" letter-spacing=".06em" class="d-tm d-muted">COST TO SERVE PER ORDER · INDEXED, Q1 = 100 · ILLUSTRATIVE</text><text x="20" y="86" font-size="14" font-weight="700" class="d-td d-text">Q1</text><rect x="80" y="64" width="76.6" height="34" rx="4" class="d-accent"/><text x="118.3" y="86" font-size="11" font-weight="700" text-anchor="middle" class="d-tm " fill="#fff">22</text><rect x="158.6" y="64" width="105.1" height="34" rx="4" class="d-accent-2" opacity=".45"/><text x="211.1" y="86" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-text">30</text><rect x="265.7" y="64" width="119.4" height="34" rx="4" class="d-surface-2"/><rect x="265.7" y="64" width="119.4" height="34" rx="4" class="d-line"/><text x="325.4" y="86" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-text">34</text><rect x="387.1" y="64" width="26.6" height="34" rx="4" class="d-warn" opacity=".7"/><rect x="415.7" y="64" width="19.4" height="34" rx="4" class="d-crit"/><text x="445.1" y="86" font-size="13" font-weight="700" class="d-tm d-text">100</text><text x="20" y="150" font-size="14" font-weight="700" class="d-td d-text">Q2</text><rect x="80" y="128" width="76.6" height="34" rx="4" class="d-accent"/><text x="118.3" y="150" font-size="11" font-weight="700" text-anchor="middle" class="d-tm " fill="#fff">22</text><rect x="158.6" y="128" width="108.7" height="34" rx="4" class="d-accent-2" opacity=".45"/><text x="212.9" y="150" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-text">31</text><rect x="269.3" y="128" width="119.4" height="34" rx="4" class="d-surface-2"/><rect x="269.3" y="128" width="119.4" height="34" rx="4" class="d-line"/><text x="329" y="150" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-text">34</text><rect x="390.7" y="128" width="33.7" height="34" rx="4" class="d-warn" opacity=".7"/><text x="407.6" y="150" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-text">10</text><rect x="426.4" y="128" width="40.9" height="34" rx="4" class="d-crit"/><text x="446.9" y="150" font-size="11" font-weight="700" text-anchor="middle" class="d-tm " fill="#fff">12</text><text x="477.3" y="150" font-size="13" font-weight="700" class="d-tm d-crit">109</text><path d="M426.4 170v8h40.9v-8" class="d-crit-s" stroke-width="1.5"/><text x="447.9" y="196" font-size="11" font-weight="700" text-anchor="middle" class="d-tm d-crit">2× vs Q1</text><rect x="20" y="222" width="12" height="12" rx="3" class="d-accent"/><text x="38" y="232" font-size="12" class="d-t d-text">Order handling</text><rect x="190" y="222" width="12" height="12" rx="3" class="d-accent-2" opacity=".45"/><text x="208" y="232" font-size="12" class="d-t d-text">Picking &amp; packing</text><rect x="360" y="222" width="12" height="12" rx="3" class="d-surface-2"/><rect x="360" y="222" width="12" height="12" rx="3" class="d-line"/><text x="378" y="232" font-size="12" class="d-t d-text">Delivery</text><rect x="20" y="248" width="12" height="12" rx="3" class="d-warn" opacity=".7"/><text x="38" y="258" font-size="12" class="d-t d-text">Customer contacts</text><rect x="190" y="248" width="12" height="12" rx="3" class="d-crit"/><text x="208" y="258" font-size="12" class="d-t d-text">Rework &amp; exceptions</text>
