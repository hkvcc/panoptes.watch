<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Order-to-invoice process with two rework loops: price mismatches send about one in nine orders back to the credit and pricing check, and stock substitutions cause re-picks. Illustrative data.</title>
<text x="20" y="28" font-size="11" letter-spacing=".06em" class="d-tm d-muted">ORDER-TO-INVOICE · TOUCHES PER 100 ORDERS · ILLUSTRATIVE</text><rect x="20" y="48" width="230" height="56" rx="12" class="d-surface"/><rect x="20" y="48" width="230" height="56" rx="12" class="d-line"/><text x="36" y="72" font-size="14" font-weight="600" class="d-td d-text">Order received</text><text x="36" y="91" font-size="11.5" font-weight="400" class="d-tm d-muted">100 touches</text><path d="M60 106V126" class="d-accent-s" stroke-width="2"/><path d="M60 130l-5 -7h10z" class="d-accent"/><rect x="20" y="132" width="230" height="56" rx="12" class="d-surface"/><rect x="20" y="132" width="230" height="56" rx="12" class="d-crit-s"/><text x="36" y="156" font-size="14" font-weight="600" class="d-td d-text">Credit &amp; pricing check</text><text x="36" y="175" font-size="11.5" font-weight="700" class="d-tm d-crit">134 touches</text><path d="M60 190V210" class="d-accent-s" stroke-width="2"/><path d="M60 214l-5 -7h10z" class="d-accent"/><rect x="20" y="216" width="230" height="56" rx="12" class="d-surface"/><rect x="20" y="216" width="230" height="56" rx="12" class="d-warn-s"/><text x="36" y="240" font-size="14" font-weight="600" class="d-td d-text">Pick &amp; pack</text><text x="36" y="259" font-size="11.5" font-weight="700" class="d-tm d-warn">112 touches</text><path d="M60 274V294" class="d-accent-s" stroke-width="2"/><path d="M60 298l-5 -7h10z" class="d-accent"/><rect x="20" y="300" width="230" height="56" rx="12" class="d-surface"/><rect x="20" y="300" width="230" height="56" rx="12" class="d-line"/><text x="36" y="324" font-size="14" font-weight="600" class="d-td d-text">Dispatch</text><text x="36" y="343" font-size="11.5" font-weight="400" class="d-tm d-muted">101 touches</text><path d="M60 358V378" class="d-accent-s" stroke-width="2"/><path d="M60 382l-5 -7h10z" class="d-accent"/><rect x="20" y="384" width="230" height="56" rx="12" class="d-surface"/><rect x="20" y="384" width="230" height="56" rx="12" class="d-line"/><text x="36" y="408" font-size="14" font-weight="600" class="d-td d-text">Invoice issued</text><text x="36" y="427" font-size="11.5" font-weight="400" class="d-tm d-muted">100 touches</text><path d="M252 412H456Q470 412 470 398V174Q470 160 456 160H258" class="d-crit-s d-flow" stroke-width="2.5"/><path d="M253 160l7 -5v10z" class="d-crit"/><rect x="286" y="302" width="168" height="56" rx="8" class="d-bg"/><rect x="286" y="302" width="168" height="56" rx="8" class="d-crit-s"/><text x="298" y="321" font-size="11.5" font-weight="600" class="d-t d-text">Price mismatch on invoice</text><text x="298" y="337" font-size="11" class="d-t d-muted">credit note + re-check</text><text x="298" y="350" font-size="10" font-weight="700" class="d-tm d-crit">≈ 1 in 9 orders</text><path d="M252 234C294 204 294 244 258 250" class="d-warn-s" stroke-width="2"/><path d="M254 250l7 -5v10z" class="d-warn"/><text x="300" y="238" font-size="11.5" font-weight="600" class="d-t d-text">Stock substitution</text><text x="300" y="253" font-size="10" font-weight="700" class="d-tm d-warn">re-pick · ≈ 1 in 8</text><path d="M20 444H500" class="d-line"/><text x="20" y="466" font-size="11.5" class="d-t d-muted">Every loop is unplanned work that volume reports do not show.</text>
</svg>
