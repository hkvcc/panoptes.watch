<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Step completion chart for a quote-to-policy journey: the identity check step fell from 88% to 74% completion while other steps held steady. Illustrative data.</title>
<text x="20" y="28" font-size="11" letter-spacing=".06em" class="d-tm d-muted">STEP COMPLETION RATE · % · ILLUSTRATIVE</text><rect x="24" y="40" width="14" height="10" rx="3" class="d-line-f"/><text x="44" y="50" font-size="12" class="d-t d-text">Previous 8 weeks</text><rect x="170" y="40" width="14" height="10" rx="3" class="d-accent"/><text x="190" y="50" font-size="12" class="d-t d-text">Last 2 weeks</text><text x="20" y="98" font-size="13" font-weight="600" class="d-t d-text">Quote started</text><text x="20" y="115" font-size="10" class="d-tm d-muted">Step 1</text><text x="170" y="104" font-size="11" class="d-t d-muted">Entry point (all journeys)</text><text x="20" y="156" font-size="13" font-weight="600" class="d-t d-text">Details entered</text><text x="20" y="173" font-size="10" class="d-tm d-muted">Step 2</text><rect x="170" y="142" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="142" width="209.9" height="14" rx="4" class="d-line-f"/><rect x="170" y="160" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="160" width="207.4" height="14" rx="4" class="d-accent"/><text x="436" y="154" font-size="11" class="d-tm d-muted">82%</text><text x="436" y="172" font-size="11" font-weight="700" class="d-tm d-text">81%</text><text x="20" y="214" font-size="13" font-weight="600" class="d-t d-crit">Identity check</text><text x="20" y="231" font-size="10" class="d-tm d-muted">Step 3</text><rect x="170" y="200" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="200" width="225.3" height="14" rx="4" class="d-line-f"/><rect x="170" y="218" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="218" width="189.4" height="14" rx="4" class="d-crit"/><text x="436" y="212" font-size="11" class="d-tm d-muted">88%</text><text x="436" y="230" font-size="11" font-weight="700" class="d-tm d-crit">74%</text><rect x="476" y="216" width="46" height="18" rx="9" class="d-crit"/><text x="499" y="229" font-size="10" font-weight="700" text-anchor="middle" class="d-tm " fill="#fff">-14 pts</text><text x="20" y="272" font-size="13" font-weight="600" class="d-t d-text">Payment set up</text><text x="20" y="289" font-size="10" class="d-tm d-muted">Step 4</text><rect x="170" y="258" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="258" width="233" height="14" rx="4" class="d-line-f"/><rect x="170" y="276" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="276" width="230.4" height="14" rx="4" class="d-accent"/><text x="436" y="270" font-size="11" class="d-tm d-muted">91%</text><text x="436" y="288" font-size="11" font-weight="700" class="d-tm d-text">90%</text><text x="20" y="330" font-size="13" font-weight="600" class="d-t d-text">Policy issued</text><text x="20" y="347" font-size="10" class="d-tm d-muted">Step 5</text><rect x="170" y="316" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="316" width="248.3" height="14" rx="4" class="d-line-f"/><rect x="170" y="334" width="256" height="14" rx="4" class="d-surface"/><rect x="170" y="334" width="248.3" height="14" rx="4" class="d-accent"/><text x="436" y="328" font-size="11" class="d-tm d-muted">97%</text><text x="436" y="346" font-size="11" font-weight="700" class="d-tm d-text">97%</text><path d="M20 366H540" class="d-line"/><text x="20" y="388" font-size="11" class="d-t d-muted">Completion = share of journeys reaching a step that go on to finish it.</text>
</svg>
