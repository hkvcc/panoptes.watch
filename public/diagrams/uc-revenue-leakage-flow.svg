<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Payment flow leak map: attempted, authorised, authentication, captured, settled and reconciled stages, with losses at each step. The 3-D Secure drop-off is more than double its four-week average. Illustrative data.</title>
<text x="20" y="30" font-size="11" letter-spacing=".06em" class="d-tm d-muted">CARD PAYMENTS · ONE WEEK · ILLUSTRATIVE</text><text x="20" y="74" font-size="13" font-weight="600" class="d-t d-text">Payment attempted</text><text x="20" y="91" font-size="11" class="d-tm d-muted">10,000</text><rect x="190" y="66" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="66" width="190" height="20" rx="5" class="d-accent-2" opacity=".85"/><text x="20" y="132" font-size="13" font-weight="600" class="d-t d-text">Authorised</text><text x="20" y="149" font-size="11" class="d-tm d-muted">8,900</text><rect x="190" y="124" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="124" width="169.1" height="20" rx="5" class="d-accent-2" opacity=".85"/><path d="M380 84C410 106 388 134 404 134" class="d-line" stroke-width="1.5" stroke-linecap="round"/><circle cx="408" cy="134" r="5" class="d-line-f"/><text x="422" y="131" font-size="12" font-weight="700" class="d-tm d-text">−1,100</text><text x="422" y="146" font-size="11" class="d-t d-muted">Declined by issuer</text><text x="422" y="160" font-size="10" class="d-tm d-muted">4-wk avg −1,080</text><text x="20" y="190" font-size="13" font-weight="600" class="d-t d-text">Authentication passed</text><text x="20" y="207" font-size="11" class="d-tm d-muted">8,000</text><rect x="190" y="182" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="182" width="152" height="20" rx="5" class="d-accent-2" opacity=".85"/><path d="M359.1 142C389.1 164 388 192 404 192" class="d-crit-s" stroke-width="2.5" stroke-linecap="round"/><circle cx="408" cy="192" r="5" class="d-crit"/><circle cx="408" cy="192" r="9" class="d-crit-s d-pulse" stroke-width="1.5"/><text x="422" y="189" font-size="12" font-weight="700" class="d-tm d-crit">−900</text><text x="422" y="204" font-size="11" class="d-t d-muted">3-D Secure drop-off</text><text x="422" y="218" font-size="10" class="d-tm d-crit">4-wk avg −420</text><text x="20" y="248" font-size="13" font-weight="600" class="d-t d-text">Captured</text><text x="20" y="265" font-size="11" class="d-tm d-muted">7,850</text><rect x="190" y="240" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="240" width="149.15" height="20" rx="5" class="d-accent-2" opacity=".85"/><path d="M342 200C372 222 388 250 404 250" class="d-line" stroke-width="1.5" stroke-linecap="round"/><circle cx="408" cy="250" r="5" class="d-line-f"/><text x="422" y="247" font-size="12" font-weight="700" class="d-tm d-text">−150</text><text x="422" y="262" font-size="11" class="d-t d-muted">Capture failed</text><text x="422" y="276" font-size="10" class="d-tm d-muted">4-wk avg −140</text><text x="20" y="306" font-size="13" font-weight="600" class="d-t d-text">Settled</text><text x="20" y="323" font-size="11" class="d-tm d-muted">7,800</text><rect x="190" y="298" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="298" width="148.20000000000002" height="20" rx="5" class="d-accent-2" opacity=".85"/><path d="M339.2 258C369.2 280 388 308 404 308" class="d-line" stroke-width="1.5" stroke-linecap="round"/><circle cx="408" cy="308" r="5" class="d-line-f"/><text x="422" y="305" font-size="12" font-weight="700" class="d-tm d-text">−50</text><text x="422" y="320" font-size="11" class="d-t d-muted">Settlement held</text><text x="422" y="334" font-size="10" class="d-tm d-muted">4-wk avg −60</text><text x="20" y="364" font-size="13" font-weight="600" class="d-t d-text">Reconciled to ledger</text><text x="20" y="381" font-size="11" class="d-tm d-muted">7,620</text><rect x="190" y="356" width="190" height="20" rx="5" class="d-surface"/><rect x="190" y="356" width="144.78" height="20" rx="5" class="d-accent"/><path d="M338.2 316C368.2 338 388 366 404 366" class="d-warn-s" stroke-width="2.5" stroke-linecap="round"/><circle cx="408" cy="366" r="5" class="d-warn"/><text x="422" y="363" font-size="12" font-weight="700" class="d-tm d-warn">−180</text><text x="422" y="378" font-size=