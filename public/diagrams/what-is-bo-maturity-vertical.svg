<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Five stages of business observability maturity: reporting, monitoring, connected, observable and operating</title>
<g class="d-t">
<rect x="10" y="10" width="340" height="70" rx="12" class="d-surface"/><rect x="10" y="10" width="340" height="70" rx="12" class="d-line"/>
<text x="24" y="36" font-size="10" class="d-tm d-muted">STAGE 1</text>
<text x="24" y="60" font-size="16" font-weight="600" class="d-td d-text">Reporting</text>
<text x="168" y="41" font-size="12" class="d-muted">What happened</text><text x="168" y="58" font-size="12" class="d-muted">last month?</text>
<rect x="10" y="90" width="340" height="70" rx="12" class="d-surface"/><rect x="10" y="90" width="340" height="70" rx="12" class="d-line"/>
<text x="24" y="116" font-size="10" class="d-tm d-muted">STAGE 2</text>
<text x="24" y="140" font-size="16" font-weight="600" class="d-td d-text">Monitoring</text>
<text x="168" y="121" font-size="12" class="d-muted">Is this number</text><text x="168" y="138" font-size="12" class="d-muted">in range?</text>
<rect x="10" y="170" width="340" height="70" rx="12" class="d-surface"/><rect x="10" y="170" width="340" height="70" rx="12" class="d-line"/>
<text x="24" y="196" font-size="10" class="d-tm d-muted">STAGE 3</text>
<text x="24" y="220" font-size="16" font-weight="600" class="d-td d-text">Connected</text>
<text x="168" y="201" font-size="12" class="d-muted">How do the</text><text x="168" y="218" font-size="12" class="d-muted">parts relate?</text>
<rect x="10" y="250" width="340" height="70" rx="12" class="d-surface-2"/><rect x="10" y="250" width="340" height="70" rx="12" class="d-accent-s"/>
<text x="24" y="276" font-size="10" class="d-tm d-muted">STAGE 4</text>
<text x="24" y="300" font-size="16" font-weight="600" class="d-td d-text">Observable</text>
<text x="168" y="281" font-size="12" class="d-muted">What is happening,</text><text x="168" y="298" font-size="12" class="d-muted">and why?</text>
<rect x="10" y="330" width="340" height="70" rx="12" class="d-accent"/>
<text x="24" y="356" font-size="10" class="d-tm" fill="#fff">STAGE 5</text>
<text x="24" y="380" font-size="16" font-weight="600" class="d-td" fill="#fff">Operating</text>
<text x="168" y="361" font-size="12" fill="#fff">What do we do,</text><text x="168" y="378" font-size="12" fill="#fff">and did it work?</text>
</g>
</svg>