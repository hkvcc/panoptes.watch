<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" fill="none">
<!--STYLE-->
<title>Five stages of business observability maturity: reporting, monitoring, connected, observable and operating</title>
<path d="M60 222C200 200 330 150 440 104S600 40 660 30" class="d-accent-2-s d-flow" stroke-width="1.5"/>
<g class="d-t">
<rect x="20" y="230" width="130" height="96" rx="12" class="d-surface"/><rect x="20" y="230" width="130" height="96" rx="12" class="d-line"/>
<text x="34" y="254" font-size="10" class="d-tm d-muted">STAGE 1</text><text x="34" y="276" font-size="15" font-weight="600" class="d-td d-text">Reporting</text>
<text x="34" y="296" font-size="11" class="d-muted">What happened</text><text x="34" y="311" font-size="11" class="d-muted">last month?</text>

<rect x="158" y="184" width="130" height="142" rx="12" class="d-surface"/><rect x="158" y="184" width="130" height="142" rx="12" class="d-line"/>
<text x="172" y="208" font-size="10" class="d-tm d-muted">STAGE 2</text><text x="172" y="230" font-size="15" font-weight="600" class="d-td d-text">Monitoring</text>
<text x="172" y="250" font-size="11" class="d-muted">Is this number</text><text x="172" y="265" font-size="11" class="d-muted">in range?</text>

<rect x="296" y="138" width="130" height="188" rx="12" class="d-surface"/><rect x="296" y="138" width="130" height="188" rx="12" class="d-line"/>
<text x="310" y="162" font-size="10" class="d-tm d-muted">STAGE 3</text><text x="310" y="184" font-size="15" font-weight="600" class="d-td d-text">Connected</text>
<text x="310" y="204" font-size="11" class="d-muted">How do the</text><text x="310" y="219" font-size="11" class="d-muted">parts relate?</text>

<rect x="434" y="92" width="130" height="234" rx="12" class="d-surface-2"/><rect x="434" y="92" width="130" height="234" rx="12" class="d-accent-s"/>
<text x="448" y="116" font-size="10" class="d-tm d-muted">STAGE 4</text><text x="448" y="138" font-size="15" font-weight="600" class="d-td d-text">Observable</text>
<text x="448" y="158" font-size="11" class="d-muted">What is happening,</text><text x="448" y="173" font-size="11" class="d-muted">and why?</text>

<rect x="572" y="46" width="130" height="280" rx="12" class="d-accent"/>
<text x="586" y="70" font-size="10" class="d-tm" fill="#fff" opacity=".8">STAGE 5</text><text x="586" y="92" font-size="15" font-weight="600" class="d-td" fill="#fff">Operating</text>
<text x="586" y="112" font-size="11" fill="#fff" opacity=".9">What do we do, and</text><text x="586" y="127" font-size="11" fill="#fff" opacity=".9">did it work?</text>
</g>
</svg>
