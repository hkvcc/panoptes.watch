<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Two-by-two matrix: statistical unusualness versus business impact, separating changes to act on now from slow drift and statistical curiosities</title>
<rect x="90" y="210" width="240" height="180" class="d-surface"/><text x="106" y="238" class="d-td d-text" font-size="14" font-weight="600">Normal variation</text><text x="106" y="257" class="d-t d-muted" font-size="11.5" font-weight="500">Absorbed by the expected band</text><rect x="330" y="210" width="240" height="180" class="d-bg"/><text x="346" y="238" class="d-td d-text" font-size="14" font-weight="600">Statistical curiosity</text><text x="346" y="257" class="d-t d-muted" font-size="11.5" font-weight="500">Log it; do not page anyone</text><rect x="90" y="30" width="240" height="180" class="d-soft"/><text x="106" y="58" class="d-td d-text" font-size="14" font-weight="600">Slow drift that matters</text><text x="106" y="77" class="d-t d-muted" font-size="11.5" font-weight="500">Route to the owner with context</text><rect x="330" y="30" width="240" height="180" class="d-soft"/><text x="346" y="58" class="d-td d-accent" font-size="14" font-weight="600">Act now</text><text x="346" y="77" class="d-t d-muted" font-size="11.5" font-weight="500">Alert the owner immediately</text><rect x="90" y="30" width="480" height="360" rx="2" class="d-line" stroke-width="1.2"/><path d="M330 30V390M90 210H570" class="d-line" stroke-width="1.2"/><circle cx="493.2" cy="138" r="7" class="d-crit"/><text x="481.2" y="142" class="d-t d-text" font-size="11.5" font-weight="600" text-anchor="end">Card completion −4.6 pts</text><circle cx="118.8" cy="152.4" r="7" class="d-warn"/><text x="130.8" y="156.4" class="d-t d-text" font-size="11.5" font-weight="600">Onboarding +0.4 d/week</text><circle cx="502.8" cy="318" r="7" class="d-accent-2"/><text x="490.8" y="322" class="d-t d-text" font-size="11.5" font-weight="600" text-anchor="end">Niche plan sign-ups ×3</text><circle cx="426" cy="282" r="7" class="d-accent-2"/><text x="414" y="286" class="d-t d-text" font-size="11.5" font-weight="600" text-anchor="end">Test-account refunds</text><circle cx="176.4" cy="325.2" r="7" class="d-line-f"/><text x="188.4" y="329.2" class="d-t d-text" font-size="11.5" font-weight="600">Normal daily wobble</text><circle cx="262.8" cy="282" r="7" class="d-line-f"/><circle cx="147.6" cy="260.4" r="7" class="d-line-f"/><circle cx="234" cy="354" r="7" class="d-line-f"/><text x="330" y="420" class="d-t d-muted" font-size="12.5" font-weight="600" text-anchor="middle">How statistically unusual is it?  →</text><text x="90" y="408" class="d-tm d-muted" font-size="10.5" font-weight="500">expected</text><text x="570" y="408" class="d-tm d-muted" font-size="10.5" font-weight="500" text-anchor="end">rare</text><text transform="translate(30 210) rotate(-90)" text-anchor="middle" class="d-t d-muted" font-size="12.5" font-weight="600">How much does it matter to the business?  →</text><text x="80" y="390" class="d-tm d-muted" font-size="10.5" font-weight="500" text-anchor="end">low</text><text x="80" y="40" class="d-tm d-muted" font-size="10.5" font-weight="500" text-anchor="end">high</text><text x="90" y="448" class="d-t d-muted" font-size="11.5" font-weight="500">Panoptes weighs both axes: impact comes from the business model (revenue, customers,</text><text x="90" y="464" class="d-t d-muted" font-size="11.5" font-weight="500">commitments exposed), not from the size of the statistical deviation alone.</text>
</svg>
