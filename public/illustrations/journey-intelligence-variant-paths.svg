<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" fill="none">
<style>.d-bg{fill:var(--d-bg,#fff)}.d-surface{fill:var(--d-surface,#F8F5FF)}.d-surface-2{fill:var(--d-surface-2,#EDE2FF)}.d-line{stroke:var(--d-line,#D9CFEA);fill:none}.d-line-f{fill:var(--d-line,#D9CFEA)}.d-text{fill:var(--d-text,#191326)}.d-muted{fill:var(--d-muted,#6E6680)}.d-accent{fill:var(--d-accent,#7126E8)}.d-accent-s{stroke:var(--d-accent,#7126E8);fill:none}.d-accent-2{fill:var(--d-accent-2,#9965FF)}.d-accent-2-s{stroke:var(--d-accent-2,#9965FF);fill:none}.d-soft{fill:var(--d-soft,#EDE2FF)}.d-ok{fill:var(--d-ok,#12A150)}.d-warn{fill:var(--d-warn,#E59A0B)}.d-crit{fill:var(--d-crit,#E0364A)}.d-ok-s{stroke:var(--d-ok,#12A150);fill:none}.d-warn-s{stroke:var(--d-warn,#E59A0B);fill:none}.d-crit-s{stroke:var(--d-crit,#E0364A);fill:none}.d-t{font-family:Inter,system-ui,sans-serif}.d-tm{font-family:'JetBrains Mono',ui-monospace,monospace}.d-td{font-family:'Space Grotesk',system-ui,sans-serif}</style>
<title>Order-to-cash variant paths: straight-through, credit hold, dispute and reissue, and manual reconciliation, with share of orders and median duration</title>
<text x="20" y="28" class="d-tm d-muted" font-size="10.5" font-weight="500" letter-spacing="1">ORDER-TO-CASH · VARIANT PATHS (FICTIONAL)</text><path d="M132 152C190 152 190 66 248 66H392C450 66 450 152 508 152" class="d-accent-s" stroke-width="22" opacity="0.55"/><rect x="236" y="51" width="168" height="30" rx="8" class="d-bg"/><rect x="236" y="51" width="168" height="30" rx="8" class="d-line" stroke-width="1.2"/><text x="248" y="70" class="d-t d-text" font-size="11.5" font-weight="600">Straight-through</text><text x="320" y="100" class="d-tm d-muted" font-size="11" font-weight="500" text-anchor="middle">68% of orders · median 3 days</text><path d="M132 161C190 161 190 136 248 136H392C450 136 450 161 508 161" class="d-accent-2-s" stroke-width="9" opacity="0.8"/><rect x="236" y="121" width="168" height="30" rx="8" class="d-bg"/><rect x="236" y="121" width="168" height="30" rx="8" class="d-line" stroke-width="1.2"/><text x="248" y="140" class="d-t d-text" font-size="11.5" font-weight="600">Credit hold → release</text><text x="320" y="170" class="d-tm d-muted" font-size="11" font-weight="500" text-anchor="middle">19% of orders · median 9 days</text><path d="M132 170C190 170 190 206 248 206H392C450 206 450 170 508 170" class="d-crit-s" stroke-width="5" opacity="0.8"/><rect x="236" y="191" width="168" height="30" rx="8" class="d-bg"/><rect x="236" y="191" width="168" height="30" rx="8" class="d-line" stroke-width="1.2"/><text x="248" y="210" class="d-t d-text" font-size="11.5" font-weight="600">Dispute → reissue invoice</text><text x="320" y="240" class="d-tm d-muted" font-size="11" font-weight="500" text-anchor="middle">9% of orders · median 21 days</text><path d="M132 179C190 179 190 270 248 270H392C450 270 450 179 508 179" class="d-warn-s" stroke-width="3" opacity="0.8"/><rect x="236" y="255" width="168" height="30" rx="8" class="d-bg"/><rect x="236" y="255" width="168" height="30" rx="8" class="d-line" stroke-width="1.2"/><text x="248" y="274" class="d-t d-text" font-size="11.5" font-weight="600">Manual reconciliation</text><text x="320" y="304" class="d-tm d-muted" font-size="11" font-weight="500" text-anchor="middle">4% of orders · median 14 days</text><rect x="20" y="140" width="112" height="50" rx="10" class="d-bg"/><rect x="20" y="140" width="112" height="50" rx="10" class="d-accent-s" stroke-width="1.4"/><text x="76" y="170" class="d-t d-text" font-size="12.5" font-weight="600" text-anchor="middle">Order placed</text><rect x="508" y="140" width="112" height="50" rx="10" class="d-accent"/><text x="564" y="170" text-anchor="middle" class="d-t" font-size="12.5" font-weight="600" fill="#fff">Cash collected</text>
</svg>
